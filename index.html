  for(let i = 0; i < 70; i++) addFx({ type:'ember', x: MOSCOW_X + rand(-40, 520), y: GROUND_Y - rand(40, 170), vx: rand(-60, 60), vy: rand(-160, -40), life: rand(1200, 3200) });
}

// Ambient spawns driven by the state of the world (embers over fires, dust on the road, breath in the cold...)
function spawnAmbient(dt){
  const e = env; if(!e) return;
  const onScreen = x => x > camera.x - 60 && x < camera.x + W + 60;
  for(const f of farms){
    if(!f.burning || !onScreen(f.x)) continue;
    if(Math.random() < dt * 0.025) addFx({ type:'ember', x: f.x + rand(-22, 22), y: (f.y || GROUND_Y + 16) - rand(20, 50), vx: rand(-25, 25) + e.wind * 0.3, vy: rand(-110, -45), life: rand(900, 2000) });
  }
  if(moscow.burned && onScreen(MOSCOW_X + 240)){
    const k = 1 - e.rp * 0.7;
    if(Math.random() < dt * 0.05 * k) addFx({ type:'ember', x: MOSCOW_X + rand(-40, 520), y: GROUND_Y - rand(60, 160), vx: rand(-30, 30) + e.wind * 0.4, vy: rand(-120, -40), life: rand(1400, 3200) });
  }
  // Ash sifting down over the scorched country and the burning city
  const ash = Math.max(e.scorch * (1 - e.snow) * 0.5, e.fire);
  if(ash > 0.05 && Math.random() < dt * 0.012 * ash) addFx({ type:'ash', screen:true, x: rand(-20, W + 20), y: -8, vx: rand(-10, 10), vy: rand(14, 30), rot: rand(0, 6), life: 14000 });
  // Golden birch leaves blowing across in late summer
  const leaves = smooth(0.26, 0.34, e.mapP) * (1 - smooth(0.46, 0.52, e.mapP)) * (1 - e.frost);
  if(leaves > 0.05 && Math.random() < dt * 0.0016 * leaves) addFx({ type:'leaf', screen:true, x: e.wind >= 0 ? -10 : W + 10, y: rand(60, 420), vx: rand(30, 60) * Math.sign(e.wind || 1), vy: rand(8, 22), rot: rand(0, 6), vr: rand(-4, 4), life: 16000, c: ['#d8a834', '#c88a2a', '#e0c050'][(Math.random() * 3) | 0] });
  // Dust kicked up by the marching column on dry roads
  const marching = phase === 'playing' && napoleonMoving();
  if(marching && e.snow < 0.1 && Math.random() < dt * 0.02){
    const s = napoleon.soldiers[(Math.random() * napoleon.soldiers.length) | 0];
    if(s && s.alive && !s.dying && onScreen(s.x)) addFx({ type:'dust', x: s.x - 6, y: s.y, vx: rand(-14, -4), vy: rand(-6, -2), r: 6, grow: 22, life: rand(900, 1500), c: css(mix(e.road, '#d8ccb0', 0.4)) });
  }
  // Breath clouds in the cold
  if(temperature < 3){
    const rate = dt * 0.004 * Math.min(1, (3 - temperature) / 10);
    const pool = russia.deployed.length && Math.random() < 0.3 ? russia.deployed : napoleon.soldiers;
    if(Math.random() < rate * 6){
      const s = pool[(Math.random() * pool.length) | 0];
      if(s && s.alive && !s.dying && onScreen(s.x)) addFx({ type:'smoke', x: s.x + (s.facing || 1) * 5, y: s.y - 37, vx: (s.facing || 1) * 10 + e.wind * 0.15, vy: -6, r: 1.5, grow: 9, life: 700, c:'#f4f6f8', a: 0.5 });
    }
  }
}

function updateFx(dt){
  spawnAmbient(dt);
  const s = dt / 1000, wind = env ? env.wind : 10;
  for(let i = fx.length - 1; i >= 0; i--){
    const p = fx[i];
    p.life -= dt;
    if(p.life <= 0 || (p.screen && (p.y > H + 20 || p.x < -40 || p.x > W + 40))){ fx[i] = fx[fx.length - 1]; fx.pop(); continue; }
    switch(p.type){
      case 'ember': p.vx += (wind * 0.5 - p.vx) * s * 0.8; p.vy += 25 * s; p.x += p.vx * s + Math.sin(p.life * 0.01) * 0.4; p.y += p.vy * s; break;
      case 'spark': p.vy += 420 * s; p.x += p.vx * s; p.y += p.vy * s; break;
      case 'splinter': if(p.y < p.floor){ p.vy += 500 * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s; } break;
      case 'smoke': case 'dust': p.vx += (wind * 0.35 - p.vx) * s * 0.5; p.x += p.vx * s; p.y += p.vy * s; p.r += p.grow * s; break;
      case 'text': p.y += p.vy * s; break;
      case 'grain': p.vy += 90 * s; p.x += p.vx * s; p.y += p.vy * s; break;
      case 'ash': case 'leaf': p.vx += (wind * 0.8 - p.vx) * s * 0.6; p.x += (p.vx + Math.sin(p.life * 0.002 + p.rot) * 12) * s; p.y += p.vy * s; p.rot += (p.vr || 1.5) * s; break;
    }
  }
  shakeAmt = Math.max(0, shakeAmt - dt * 0.012);
}

function drawParticles(){
  const cx = camera.x;
  for(const p of fx){
    const x = p.screen ? p.x : p.x - cx, y = p.y, k = p.life / p.max;
    if(x < -60 || x > W + 60) continue;
    switch(p.type){
      case 'ember':
        drawGlow('#ff7a20', x, y, 7, k * 0.7);
        ctx.fillStyle = `rgba(255,${200 - (1 - k) * 120 | 0},90,${Math.min(1, k * 1.5)})`; ctx.fillRect(x - 1, y - 1, 2, 2); break;
      case 'spark':
        ctx.strokeStyle = `rgba(255,236,170,${k})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * 0.025, y - p.vy * 0.025); ctx.stroke(); break;
      case 'flash':
        drawGlow('#ffd890', x, y, 26, k); ctx.fillStyle = `rgba(255,250,220,${k})`; ctx.beginPath(); ctx.arc(x, y, 4 * k + 1, 0, TAU); ctx.fill(); break;
      case 'splinter':
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, k * 2);
        ctx.fillStyle = '#7a5a34'; ctx.fillRect(-5, -1, 10, 2.2); ctx.restore(); break;
      case 'smoke': case 'dust':
        drawPuff(p.c, x, y, p.r, (p.a || 0.35) * Math.min(1, k * 1.8) * Math.min(1, (1 - k) * 8 + 0.2)); break;
      case 'ash':
        ctx.fillStyle = `rgba(70,64,60,${Math.min(0.75, k * 3)})`;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillRect(-1.5, -0.8, 3, 1.6); ctx.restore(); break;
      case 'leaf':
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.7)) * 0.8 + 0.2);
        ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 1.8, 0, 0, TAU); ctx.fill(); ctx.restore(); break;
      case 'grain':
        ctx.fillStyle = `rgba(236,200,96,${Math.min(1, k * 2)})`; ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4); break;
      case 'text':
        ctx.globalAlpha = Math.min(1, k * 2.5);
        ctx.font = 'bold 13px Cinzel, serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(16,10,6,0.85)'; ctx.strokeText(p.text, x, y);
        ctx.fillStyle = p.c; ctx.fillText(p.text, x, y);
        ctx.globalAlpha = 1; break;
    }
  }
}

// Souls of the men taken by typhus and dysentery drift up and fade
function drawGhosts(){
  for(const g of ghosts){
    const sx = g.x - camera.x;
    if(sx < -40 || sx > W + 40) continue;
    const k = Math.max(0, g.life / g.maxLife), rise = 1 - k;
    const a = Math.min(1, k * 1.4) * Math.min(1, rise * 6) * 0.7;
    const sway = Math.sin(gameTime * 0.004 + g.x) * 4 * rise;
    const starved = g.kind === 'starve';
    for(let j = 0; j < 5; j++){
      const u = j / 4;
      drawPuff(starved ? '#e2dacb' : '#d4ecd0', sx + sway * (1 - u) + Math.sin(gameTime * 0.006 + j) * 1.5, g.y - 20 - u * 18, 9 - u * 3.5 + rise * 4, a * (0.45 + u * 0.4));
    }
    drawGlow(starved ? '#e8dcc0' : '#b8f0c8', sx + sway * 0.2, g.y - 36, 22, a * 0.35);
    ctx.fillStyle = `rgba(30,50,40,${a * 0.55})`;
    ctx.fillRect(sx + sway * 0.2 - 2.5, g.y - 40, 1.6, 1.6); ctx.fillRect(sx + sway * 0.2 + 1.5, g.y - 40, 1.6, 1.6);
  }
}

// -- WEATHER --
// Layered snow: z is depth (far flakes small and slow, near flakes large and fast)
function spawnAndUpdateSnow(dt){
  const rp = winterProgress();
  const w = env ? env.wind : -40;
  const rate = (0.012 + rp * 0.26) * dt;
  const n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
  for(let i = 0; i < n && snowflakes.length < 700; i++){
    const z = rand(0.35, 1.35);
    snowflakes.push({ x: w < 0 ? rand(0, W + 260) : rand(-260, W), y: rand(-20, -4), z, r: 0.6 + z * 1.5, vy: 30 + z * 48, wobble: rand(0, TAU) });
  }
  for(let i = snowflakes.length - 1; i >= 0; i--){
    const fl = snowflakes[i];
    fl.wobble += dt * 0.003;
    fl.vx = w * (0.6 + fl.z * 0.5) + Math.sin(fl.wobble) * 10;
    fl.x += fl.vx * (dt / 1000);
    fl.y += fl.vy * (dt / 1000);
    if(fl.y > H + 8 || fl.x < -30 || fl.x > W + 300) snowflakes.splice(i, 1);
  }
}
function drawSnow(){
  const e = env;
  // Fog banks of blowing snow roll across the field in the blizzard
  if(e.fog > 0.05){
    for(let i = 0; i < 6; i++){
      const span = W + 700, x = posMod(hash1(i * 7) * span + gameTime * 0.001 * e.wind * (0.5 + hash1(i) * 0.5), span) - 350;
      const y = HORIZON_Y + 30 + hash1(i * 3 + 1) * 230;
      drawPuff(e.haze, x, y, 170 + hash1(i * 5) * 120, e.fog * 0.45);
    }
  }
  if(snowflakes.length === 0) return;
  const streak = smooth(0.45, 1, e.rp), flake = getPuff('#ffffff');
  ctx.strokeStyle = 'rgba(240,244,250,0.55)'; ctx.lineCap = 'round';
  for(const fl of snowflakes){
    const a = Math.min(1, (H - fl.y + 50) / 80) * (0.45 + fl.z * 0.4);
    if(streak > 0.05 && fl.z > 0.9){
      // Near flakes smear into streaks in the gale
      ctx.globalAlpha = a * 0.8; ctx.lineWidth = fl.r * 1.1;
      ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(fl.x - fl.vx * 0.04 * streak, fl.y - fl.vy * 0.04 * streak); ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.drawImage(flake, fl.x - fl.r * 1.6, fl.y - fl.r * 1.6, fl.r * 3.2, fl.r * 3.2);
    }
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}

// -- POST-PROCESSING --
const vignetteCanvas = (() => {
  const c = makeCanvas(W, H), g = c.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H * 0.48, H * 0.32, W / 2, H * 0.5, W * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.7, 'rgba(0,0,0,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0.85)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  return c;
})();
const grainCanvas = (() => {
  const c = makeCanvas(256, 256), g = c.getContext('2d'), img = g.createImageData(256, 256);
  for(let i = 0; i < img.data.length; i += 4){ const v = Math.random() * 255 | 0; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  return c;
})();
let grainPattern = null;
// Colour grade (season and fire), vignette and a whisper of film grain over the world, under the HUD
function drawPost(){
  const e = env;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = css(mix('#ffffff', shade(e.grade, e.light), 0.85));
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.42 + e.fog * 0.2 + e.fire * 0.25 + e.rp * 0.15;
  ctx.drawImage(vignetteCanvas, 0, 0, W, H);
  if(!grainPattern) grainPattern = ctx.createPattern(grainCanvas, 'repeat');
  ctx.globalAlpha = 0.032;
  ctx.save(); ctx.translate(-(Math.random() * 256 | 0), -(Math.random() * 256 | 0));
  ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  ctx.globalAlpha = 1;
}
// -- GAME LOOP --
let lastTs=0;
function loop(ts){
const dt=Math.min(50, ts-lastTs);
lastTs=ts;
if(phase!=='title') update(dt);
else gameTime += dt; // for title animation
draw();
requestAnimationFrame(loop);
}

requestAnimationFrame(ts=>{ lastTs=ts; requestAnimationFrame(loop); });
</script>
