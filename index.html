// -- DRAWING --
// -- FLOOR --
const ROAD_TOP = GROUND_Y + 30, ROAD_BOT = GROUND_Y + 80;
// Far-field bands between the horizon and the road, closer together near the horizon
const FIELD_BANDS = [HORIZON_Y, 257, 263, 271, 281, 294, 310, 330, ROAD_TOP - 6];
function edgeNoise(wx, seed){ return Math.sin(wx * 0.021 + seed) * 1.6 + Math.sin(wx * 0.057 + seed * 2.1) * 1.0; }

function drawGround(){
  const e = env, hz = HORIZON_Y, cx = camera.x;
  // Base: hazy at the far edge, richer underfoot
  const g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, css(mix(e.field, e.haze, 0.5 + e.fog * 0.3)));
  g.addColorStop(0.35, css(mix(e.field, e.haze, 0.12)));
  g.addColorStop(1, css(mix(e.field, e.soil, 0.35)));
  ctx.fillStyle = g; ctx.fillRect(0, hz, W, H - hz);

  drawFarFields();
  drawNearField();
  drawRoad();
  // Blizzard haze lies thickest at the far edge of the floor
  if(e.fog > 0.01){
    const fg = ctx.createLinearGradient(0, hz, 0, ROAD_TOP);
    fg.addColorStop(0, css(e.haze, e.fog * 0.75)); fg.addColorStop(1, css(e.haze, 0));
    ctx.fillStyle = fg; ctx.fillRect(0, hz, W, ROAD_TOP - hz);
  }
}

// Patchwork of crop strips and meadows; burnt in the steppe, buried under snow in winter
function drawFarFields(){
  const e = env, cx = camera.x;
  const summer = ['#9cb466', '#c9b35c', '#a8a058', '#7f9248', '#8f7c52', '#b7ab62'];
  const scorched = ['#3a2c20', '#4e3c2a', '#2c2218', '#5a4a38', '#463626', '#33281c'];
  const forest = smooth(0.2, 0.3, e.mapP) * (1 - smooth(0.68, 0.74, e.mapP)); // clearings, not farmland
  for(let b = 0; b < FIELD_BANDS.length - 1; b++){
    const y0 = FIELD_BANDS[b], y1 = FIELD_BANDS[b + 1];
    const depth = 1 - b / (FIELD_BANDS.length - 1);     // 1 at the horizon
    const cell = 150 + b * 45, shift = b * 97;
    const i0 = Math.floor((cx + shift) / cell), i1 = Math.floor((cx + shift + W) / cell);
    for(let i = i0; i <= i1; i++){
      const hsh = hash1(i * 131 + b * 7919);
      let c = mix(summer[(hsh * summer.length) | 0], e.field, 0.35 + forest * 0.45);
      c = mix(c, scorched[(hsh * 7 | 0) % scorched.length], e.scorch * 0.9);
      c = mix(c, '#8a8676', e.frost * 0.7);
      c = mix(c, mix(SNOW_LIT, '#dfe6ee', hsh * 0.6), e.snow * 0.96);
      c = mix(c, e.haze, depth * 0.45 + e.fog * 0.3);
      const x0 = i * cell - shift - cx, x1 = x0 + cell + 1;
      ctx.fillStyle = css(c);
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0 + 0.5);
      // Furrows in the nearer, cultivated strips
      if(b >= 4 && hsh < 0.7 && forest < 0.5){
        ctx.fillStyle = css(shade(c, 0.9), 0.5);
        const rows = 2 + (b >> 1);
        for(let r = 1; r < rows; r++) ctx.fillRect(x0, y0 + (y1 - y0) * r / rows, x1 - x0, 1);
      }
    }
    // Hedgerow / field boundary line between bands
    if(b > 0){
      ctx.fillStyle = css(mix(shade(e.land, 0.85), e.haze, depth * 0.5), 0.55 * (1 - e.snow * 0.6));
      ctx.fillRect(0, y0 - 0.5, W, 1 + (b > 4 ? 1 : 0));
    }
  }
  drawFieldProps();
}

// Hedges, fences, stooks and wayside crosses on the far field (world-anchored)
function drawFieldProps(){
  const e = env, cx = camera.x, cell = 260;
  const i0 = Math.floor(cx / cell) - 1, i1 = Math.floor((cx + W) / cell) + 1;
  const hedge = mix(mix(e.canopy, e.land, 0.5), e.haze, 0.25);
  for(let i = i0; i <= i1; i++){
    const h = hash1(i * 977 + 11), kind = (h * 10) | 0;
    const x = i * cell + hash1(i * 41) * 180 - cx;
    const band = 2 + ((hash1(i * 59) * 4) | 0);
    const y = FIELD_BANDS[band] + 1, s = 0.55 + band * 0.12;
    if(kind <= 2){
      // Hedgerow of bushes
      const n = 3 + kind;
      for(let k = 0; k < n; k++){
        const bx = x + k * 9 * s, r = (4 + hash1(i + k) * 3) * s;
        ctx.fillStyle = css(shade(hedge, 0.8)); ctx.beginPath(); ctx.ellipse(bx, y - r * 0.6, r * 1.2, r, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = css(mix(hedge, '#e8e0b0', 0.12)); ctx.beginPath(); ctx.ellipse(bx + r * 0.3, y - r * 0.9, r * 0.7, r * 0.6, 0, 0, TAU); ctx.fill();
        if(e.snow > 0.1){ ctx.fillStyle = css(SNOW_LIT, e.snow); ctx.beginPath(); ctx.ellipse(bx, y - r * 1.35, r * 0.9, r * 0.35, 0, 0, TAU); ctx.fill(); }
      }
    } else if(kind <= 4){
      // Split-rail fence
      const len = (50 + hash1(i * 3) * 60) * s;
      ctx.strokeStyle = css(mix('#5a4630', e.haze, 0.3)); ctx.lineWidth = Math.max(1, s);
      ctx.beginPath(); ctx.moveTo(x, y - 6 * s); ctx.lineTo(x + len, y - 6 * s); ctx.moveTo(x, y - 3 * s); ctx.lineTo(x + len, y - 3 * s);
      for(let px = 0; px <= len; px += 12 * s){ ctx.moveTo(x + px, y); ctx.lineTo(x + px, y - 8 * s); }
      ctx.stroke();
    } else if(kind <= 6 && e.scorch < 0.5 && e.snow < 0.5){
      // Wheat stooks
      for(let k = 0; k < 4; k++){
        const sx = x + k * 14 * s;
        ctx.fillStyle = css(mix(mix('#c8a848', '#9a8a6a', e.frost), e.haze, 0.2));
        ctx.beginPath(); ctx.moveTo(sx - 3.5 * s, y); ctx.lineTo(sx, y - 9 * s); ctx.lineTo(sx + 3.5 * s, y); ctx.fill();
      }
    } else if(kind === 7){
      // Wayside cross
      ctx.fillStyle = css(mix('#4a3a2a', e.haze, 0.2));
      ctx.fillRect(x - 0.8 * s, y - 16 * s, 1.6 * s, 16 * s); ctx.fillRect(x - 4 * s, y - 13 * s, 8 * s, 1.5 * s);
      ctx.fillRect(x - 2.5 * s, y - 9 * s, 5 * s, 1.2 * s);
    }
  }
}

// Ground between the road and the bottom edge: grass, flowers, stones; ash; snowdrifts
function drawNearField(){
  const e = env, cx = camera.x, cell = 70;
  const i0 = Math.floor(cx / cell) - 1, i1 = Math.floor((cx + W) / cell) + 1;
  const grassDark = css(shade(mix(e.grass, e.soil, 0.2), 0.78));
  const grassLit = css(mix(e.grass, '#f0e8b0', 0.15));
  const flowers = (1 - smooth(0.2, 0.55, e.advP)) * (1 - e.frost);
  for(let i = i0; i <= i1; i++){
    const h1 = hash1(i * 7 + 3), h2 = hash1(i * 13 + 5), h3 = hash1(i * 29 + 1);
    const x = i * cell + h1 * cell - cx;
    // Soft tonal patches break up the flat floor
    const py = ROAD_BOT + 18 + h2 * (H - ROAD_BOT - 20);
    const pc = h3 > 0.5 ? shade(e.field, 0.9) : mix(e.field, '#f4f0d0', 0.08);
    ctx.fillStyle = css(pc, 0.55);
    ctx.beginPath(); ctx.ellipse(x, py, 30 + h3 * 40, 5 + h1 * 6, 0, 0, TAU); ctx.fill();
    // Same patches above the road, thinner with distance
    const py2 = ROAD_TOP - 8 - h3 * 26;
    ctx.fillStyle = css(pc, 0.4);
    ctx.beginPath(); ctx.ellipse(x + 20, py2, 22 + h2 * 26, 2.5 + h1 * 2, 0, 0, TAU); ctx.fill();

    if(e.snow > 0.3){
      // Wind-sculpted drifts with blue shadow on the lee side
      const dy = ROAD_BOT + 30 + h1 * (H - ROAD_BOT - 40), dw = 26 + h2 * 34;
      ctx.fillStyle = css(SNOW_SH, 0.5 * e.snow); ctx.beginPath(); ctx.ellipse(x + 4, dy + 2, dw, 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = css('#f4f7fa', 0.85 * e.snow); ctx.beginPath(); ctx.ellipse(x, dy, dw * 0.9, 4, 0, 0, TAU); ctx.fill();
    }
    // Tufts of grass (or burnt stubble / frozen stalks)
    const tufts = 2 + (h2 * 3 | 0);
    for(let k = 0; k < tufts; k++){
      const tx = x + (hash1(i * 17 + k) - 0.5) * cell;
      const ty = ROAD_BOT + 14 + hash1(i * 23 + k * 3) * (H - ROAD_BOT - 14);
      const th = 4 + hash1(i + k * 31) * 6 * (0.6 + (ty - ROAD_BOT) / 200);
      if(e.scorch > 0.5 && e.snow < 0.5){
        ctx.fillStyle = 'rgba(24,16,10,0.7)';
        ctx.fillRect(tx, ty - th * 0.6, 1, th * 0.6); ctx.fillRect(tx + 3, ty - th * 0.4, 1, th * 0.4);
        if(hash1(i * 5 + k) > 0.8){ ctx.fillStyle = `rgba(255,110,30,${0.35 + 0.25 * Math.sin(gameTime * 0.006 + i + k)})`; ctx.fillRect(tx - 1, ty - 1, 3, 2); }
        continue;
      }
      const sway = Math.sin(gameTime * 0.0012 + tx * 0.05) * 1.2 * (1 - e.frost);
      ctx.strokeStyle = grassDark; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for(let bl = -1; bl <= 1; bl++){ ctx.moveTo(tx + bl * 2, ty); ctx.quadraticCurveTo(tx + bl * 2 + sway * 0.5, ty - th * 0.6, tx + bl * 3 + sway, ty - th * (bl ? 0.8 : 1)); }
      ctx.stroke();
      ctx.strokeStyle = grassLit; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(tx + 1, ty); ctx.quadraticCurveTo(tx + 1 + sway * 0.5, ty - th * 0.5, tx + 2 + sway, ty - th * 0.9); ctx.stroke();
      if(e.snow > 0.4){ ctx.fillStyle = css('#f4f7fa', e.snow * 0.9); ctx.beginPath(); ctx.ellipse(tx, ty, 6, 2, 0, 0, TAU); ctx.fill(); }
      if(flowers > 0.05 && hash1(i * 19 + k) > 0.55){
        const fc = ['#d8343a', '#f2d24a', '#f4f0e8', '#8a6ad0'][(hash1(i * 3 + k) * 4) | 0];
        ctx.fillStyle = css(fc, flowers); ctx.fillRect(tx + sway, ty - th - 1, 2, 2);
      }
    }
    // Stones
    if(h3 > 0.72){
      const sx = x + 18, sy = ROAD_BOT + 22 + h2 * 100;
      ctx.fillStyle = css(mix('#7a7468', e.soil, 0.3)); ctx.beginPath(); ctx.ellipse(sx, sy, 4 + h1 * 3, 2.5 + h1, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = css(e.snow > 0.3 ? SNOW_LIT : '#a8a294', 0.8); ctx.beginPath(); ctx.ellipse(sx - 1, sy - 1, 2.5 + h1 * 2, 1.2, 0, 0, TAU); ctx.fill();
    }
  }
}

// The Smolensk road: worn dirt with wheel ruts; trampled, filthy snow in the retreat
function drawRoad(){
  const e = env, cx = camera.x;
  const road = e.road, edgeCol = shade(road, 0.82);
  ctx.fillStyle = css(road);
  ctx.beginPath();
  ctx.moveTo(-4, ROAD_TOP);
  for(let x = -4; x <= W + 8; x += 8) ctx.lineTo(x, ROAD_TOP + edgeNoise(x + cx, 1.3));
  for(let x = W + 8; x >= -4; x -= 8) ctx.lineTo(x, ROAD_BOT + edgeNoise(x + cx, 4.1));
  ctx.closePath(); ctx.fill();
  // Shading: darker edges, worn lighter crown
  const rg = ctx.createLinearGradient(0, ROAD_TOP, 0, ROAD_BOT);
  rg.addColorStop(0, css(edgeCol, 0.6)); rg.addColorStop(0.25, css(road, 0)); rg.addColorStop(0.5, css(mix(road, '#ffffff', 0.12), 0.5));
  rg.addColorStop(0.75, css(road, 0)); rg.addColorStop(1, css(edgeCol, 0.7));
  ctx.fillStyle = rg; ctx.fillRect(0, ROAD_TOP - 3, W, ROAD_BOT - ROAD_TOP + 6);
  // Wheel ruts (in the retreat: churned brown slush through the snow)
  const rutCol = e.snow > 0.3 ? mix('#6a5a48', road, 0.35) : shade(road, 0.72);
  ctx.strokeStyle = css(rutCol, 0.75); ctx.lineWidth = 2.5;
  for(const ry of [ROAD_TOP + 15, ROAD_TOP + 21, ROAD_BOT - 19, ROAD_BOT - 13]){
    ctx.beginPath();
    for(let x = -4; x <= W + 8; x += 16){ const y = ry + Math.sin((x + cx) * 0.013 + ry) * 1.3; x === -4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // Pebbles, hoof prints and the odd puddle
  const cell = 46, i0 = Math.floor(cx / cell) - 1, i1 = Math.floor((cx + W) / cell) + 1;
  for(let i = i0; i <= i1; i++){
    const h = hash1(i * 71 + 9), x = i * cell + h * cell - cx, y = ROAD_TOP + 6 + hash1(i * 37) * (ROAD_BOT - ROAD_TOP - 12);
    ctx.fillStyle = css(shade(road, h > 0.5 ? 0.7 : 1.18), 0.8);
    ctx.fillRect(x, y, 2, 1.5); ctx.fillRect(x + 7, y + 3, 1.5, 1.5);
    if(h > 0.86 && e.snow < 0.5 && e.scorch < 0.5){
      ctx.fillStyle = css(mix(e.hor, shade(road, 0.6), 0.55), 0.45);
      ctx.beginPath(); ctx.ellipse(x + 10, y, 10 + h * 5, 2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x + 5, y - 0.5, 6, 1);
    }
  }
  // Grass verges hanging over the road edges
  if(e.snow < 0.6){
    ctx.strokeStyle = css(shade(e.grass, e.scorch > 0.5 ? 0.4 : 0.8), 0.9); ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i = i0 * 3; i <= i1 * 3; i++){
      const wx = i * (cell / 3), x = wx - cx, h = hash1(i * 3 + 1);
      const yt = ROAD_TOP + edgeNoise(wx, 1.3) + 1, yb = ROAD_BOT + edgeNoise(wx, 4.1) + 1;
      ctx.moveTo(x, yt); ctx.lineTo(x + 2 - h * 4, yt - 3 - h * 3);
      ctx.moveTo(x + 5, yb); ctx.lineTo(x + 6 - h * 3, yb - 3 - h * 4);
    }
    ctx.stroke();
  } else {
    // Snowbanks pushed to the roadside
    ctx.fillStyle = css('#f2f5f9', 0.9 * e.snow);
    for(const yb of [ROAD_TOP, ROAD_BOT]){
      ctx.beginPath(); ctx.moveTo(-4, yb + 2);
      for(let x = -4; x <= W + 8; x += 12) ctx.lineTo(x, yb - 2 - Math.abs(Math.sin((x + cx) * 0.031 + yb)) * 3);
      ctx.lineTo(W + 8, yb + 2); ctx.closePath(); ctx.fill();
    }
  }
}
// -- RIVERS --
// Rivers of the Smolensk road, in order from the Niemen
const RIVER_NAMES = ['Viliya', 'Dvina', 'Dnieper', 'Vop', 'Kolocha', 'Moskva'];
const ROAD_MID = (ROAD_TOP + ROAD_BOT) / 2;
// Half-width and centre offset at screen row y: narrow and winding toward the horizon
function riverHalfWidth(river, y){
  if(y <= ROAD_MID){ const u = clamp01((y - HORIZON_Y) / (ROAD_MID - HORIZON_Y)); return river.width * 0.5 * (0.2 + 0.8 * Math.pow(u, 0.85)); }
  return river.width * 0.5 + (y - ROAD_MID) * 0.17;
}
function riverOffset(river, y){
  const seed = river.x * 0.013;
  if(y <= ROAD_MID){ const u = clamp01((y - HORIZON_Y) / (ROAD_MID - HORIZON_Y)); return Math.sin(y * 0.05 + seed) * 24 * Math.pow(1 - u, 1.3); }
  return Math.sin(y * 0.035 + seed) * 12 * (y - ROAD_MID) / (H - ROAD_MID);
}

function drawRivers(){
  const e = env;
  const freeze = smooth(0.12, 0.55, e.rp);
  for(let ri = 0; ri < rivers.length; ri++){
    const river = rivers[ri];
    const sx = river.x - camera.x;
    if(sx < -220 || sx > W + 220) continue;
    const L = [], R = [];
    for(let y = HORIZON_Y; y <= H + 4; y += 4){
      const c = sx + riverOffset(river, y), hw = riverHalfWidth(river, y);
      L.push([c - hw, y]); R.push([c + hw, y]);
    }
    const bank = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
    // Muddy banks, then the water itself
    ctx.lineJoin = 'round';
    ctx.strokeStyle = css(mix(shade(e.soil, 0.7), SNOW_SH, e.snow * 0.6)); ctx.lineWidth = 7;
    bank(L); bank(R);
    const wg = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
    const deep = mix(mix('#2c4c5e', e.top, 0.25), '#3a2a24', e.fire * 0.3);
    wg.addColorStop(0, css(mix(e.hor, deep, 0.25))); wg.addColorStop(0.4, css(mix(e.mid, deep, 0.55))); wg.addColorStop(1, css(deep));
    const ice = mix('#c8d6e2', SNOW_LIT, freeze * 0.4);
    ctx.fillStyle = wg;
    ctx.beginPath();
    L.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    for(let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath(); ctx.fill();
    if(freeze > 0.01){
      // Ice creeps in from both banks until only a dark lead of open water remains
      ctx.save(); ctx.clip();
      ctx.fillStyle = css(ice, Math.min(1, freeze * 1.6)); ctx.fill();
      if(freeze < 0.98){
        ctx.fillStyle = css(deep, 1 - freeze);
        ctx.beginPath();
        for(let i = 0; i < L.length; i++){ const c = (L[i][0] + R[i][0]) / 2, hw = (R[i][0] - L[i][0]) / 2 * (1 - freeze) * 0.7; i ? ctx.lineTo(c - hw, L[i][1]) : ctx.moveTo(c - hw, L[i][1]); }
        for(let i = R.length - 1; i >= 0; i--){ const c = (L[i][0] + R[i][0]) / 2, hw = (R[i][0] - L[i][0]) / 2 * (1 - freeze) * 0.7; ctx.lineTo(c + hw, R[i][1]); }
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = css('#7f97ad', freeze * 0.7); ctx.lineWidth = 0.8;
      ctx.beginPath();
      for(let k = 0; k < 9; k++){
        const y0 = HORIZON_Y + 30 + hash1(ri * 17 + k) * (H - HORIZON_Y - 30);
        const c = sx + riverOffset(river, y0), hw = riverHalfWidth(river, y0);
        let x = c - hw + hash1(k * 3 + ri) * hw * 2, y = y0;
        ctx.moveTo(x, y);
        for(let j = 0; j < 4; j++){ x += (hash1(k * 7 + j) - 0.5) * 16; y += 3 + hash1(k + j * 5) * 6; ctx.lineTo(x, y); }
      }
      ctx.stroke();
      ctx.restore();
    }
    // Flow: light streaks drifting toward the viewer
    const openW = 1 - freeze;
    if(openW > 0.05){
      ctx.strokeStyle = css(mix(e.hor, '#ffffff', 0.4), 0.45 * openW); ctx.lineWidth = 1;
      ctx.beginPath();
      const span = H - HORIZON_Y;
      for(let k = 0; k < 16; k++){
        const y = HORIZON_Y + posMod(hash1(k * 11 + ri) * span + gameTime * 0.014 * (0.6 + hash1(k) * 0.8), span);
        const hw = riverHalfWidth(river, y) * (1 - freeze * 0.7), c = sx + riverOffset(river, y);
        const x = c + (hash1(k * 5 + ri * 3) - 0.5) * hw * 1.4, len = 3 + hw * 0.35;
        ctx.moveTo(x - len / 2, y); ctx.lineTo(x + len / 2, y);
      }
      ctx.stroke();
    }
    // Wet edge catching the light
    ctx.strokeStyle = css(mix(e.hor, '#ffffff', 0.3), 0.35 * (1 - freeze)); ctx.lineWidth = 1;
    ctx.save(); ctx.translate(1.5, 0); bank(L); ctx.translate(-3, 0); bank(R); ctx.restore();
    // Reeds along the banks in summer, frozen stalks in winter
    const reed = css(mix(mix('#5a7a3a', '#8a7a4a', smooth(0.4, 0.8, e.advP)), '#6a6656', e.frost), 0.9);
    ctx.strokeStyle = reed; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let k = 0; k < 14; k++){
      const side = k % 2 ? R : L, idx = 8 + ((hash1(k * 13 + ri) * (side.length - 10)) | 0);
      const [bx, by] = side[idx];
      if(by > ROAD_TOP - 8 && by < ROAD_BOT + 10) continue;   // keep the crossing clear
      const s = 0.6 + (by - HORIZON_Y) / 300;
      for(let j = 0; j < 4; j++){
        const rx = bx + (k % 2 ? 3 : -3) + (j - 1.5) * 2 * s, sw = Math.sin(gameTime * 0.0015 + k + j) * 1.5;
        ctx.moveTo(rx, by + 2); ctx.quadraticCurveTo(rx, by - 6 * s, rx + sw, by - (9 + j * 2) * s);
      }
    }
    ctx.stroke();
    // Map-style name where the river meets the horizon
    const top = L[4];
    ctx.font = 'italic 11px "IM Fell English", serif'; ctx.textAlign = 'left';
    ctx.fillStyle = css(mix('#2a2420', e.haze, 0.25), 0.7);
    ctx.fillText(`R. ${RIVER_NAMES[ri] || ''}`, top[0] + riverHalfWidth(river, top[1]) * 2 + 8, top[1] + 4);
  }
  ctx.lineJoin = 'miter';
}

// -- BRIDGES --
function bridgeGeom(b){
  const sx = b.x - camera.x, bw = b.width + 14;
  return { sx, bw, l: sx - bw / 2, r: sx + bw / 2, top: ROAD_TOP - 3, bot: ROAD_BOT + 4 };
}
// 1 = intact, 0..1 = being rebuilt (planks advancing from the army's bank), 0 = broken
function bridgeBuildFrac(b){
  if(b.intact) return 1;
  if(napoleon.buildingBridge && Math.abs(napoleon.x - b.x) < 110) return clamp01(napoleon.bridgeBuildTime / napoleon.bridgeBuildMax);
  return 0;
}
const WOOD = { deck:'#8a6a42', seam:'#4e3a22', beam:'#5a4228', post:'#4a3420', rail:'#6e5232', char:'#221810' };

function drawBridges(){
  const e = env;
  for(const b of bridges){
    const g = bridgeGeom(b);
    if(g.sx < -140 || g.sx > W + 140) continue;
    const f = bridgeBuildFrac(b);
    const fromRight = napoleon.retreating;
    const deckCol = mix(WOOD.deck, SNOW_LIT, e.snow * 0.55);
    const dmg = b.intact ? 1 - b.hp / b.maxHp : 0;
    // Built span (stubs remain on both banks when broken)
    const stub = 12;
    const spans = f >= 1 ? [[g.l, g.r]]
      : fromRight ? [[g.l, g.l + stub], [g.r - stub - (g.bw - 2 * stub) * f, g.r]]
                  : [[g.l, g.l + stub + (g.bw - 2 * stub) * f], [g.r - stub, g.r]];
    // Pilings: whole posts under built span, charred stumps elsewhere
    for(let px = g.l + 8; px < g.r - 4; px += 19){
      const built = spans.some(([a, z]) => px >= a && px <= z);
      ctx.fillStyle = css(built ? WOOD.post : WOOD.char);
      const ph = built ? 22 : 9 + hash1(px | 0) * 6;
      ctx.fillRect(px - 2, g.bot + 4, 4, ph);
      ctx.fillStyle = css(mix(e.hor, '#ffffff', 0.4), 0.35);
      ctx.fillRect(px - 4, g.bot + 4 + ph - 1, 8, 1.2);
    }
    for(const [a, z] of spans){
      if(z - a < 1) continue;
      // Shadow on the water, beam face, then the deck boards
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(a, g.bot + 4, z - a, 8);
      ctx.fillStyle = css(shade(WOOD.beam, 1 - dmg * 0.4)); ctx.fillRect(a, g.bot - 1, z - a, 6);
      ctx.fillStyle = css(shade(deckCol, 1 - dmg * 0.35)); ctx.fillRect(a, g.top, z - a, g.bot - g.top);
      ctx.fillStyle = css(WOOD.seam, 0.55);
      for(let p = a + 3; p < z; p += 6) ctx.fillRect(p, g.top, 1, g.bot - g.top);
      ctx.fillStyle = css(mix(deckCol, '#ffffff', 0.18), 0.5); ctx.fillRect(a, g.top + 18, z - a, 16);
      ctx.fillStyle = css(WOOD.beam); ctx.fillRect(a, g.top - 2, z - a, 3);
    }
    if(dmg > 0.15){
      ctx.fillStyle = css(WOOD.char, 0.6 * dmg);
      ctx.beginPath(); ctx.ellipse(g.sx - 10, ROAD_MID, 12 * dmg + 4, 6, 0.3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(g.sx + 16, ROAD_MID + 10, 9 * dmg + 3, 5, -0.2, 0, TAU); ctx.fill();
    }
    // Ragged, burnt edges where the span ends
    if(f < 1){
      ctx.fillStyle = css(WOOD.char);
      for(const [a, z] of spans) for(const ex of [a, z]){
        if(ex === g.l || ex === g.r) continue;
        for(let k = 0; k < 6; k++) ctx.fillRect(ex - 2, g.top + k * 9 + (hash1(k + (ex | 0)) * 4), 4, 5);
      }
      if(f === 0){
        // Wreckage drifting downstream
        for(let k = 0; k < 3; k++){
          const dy = posMod(k * 40 + gameTime * 0.006, 110);
          ctx.save(); ctx.translate(g.sx - 18 + k * 16 + Math.sin(gameTime * 0.001 + k) * 4, g.bot + 14 + dy);
          ctx.rotate(0.3 * Math.sin(k * 2 + gameTime * 0.0008)); ctx.globalAlpha = 1 - dy / 110;
          ctx.fillStyle = css(WOOD.deck); ctx.fillRect(-12, -2, 24, 4);
          ctx.fillStyle = css(WOOD.char); ctx.fillRect(6, -2, 6, 4);
          ctx.restore();
        }
      }
    }
    // Far railing (behind the troops)
    for(const [a, z] of spans){
      if(z - a < 4) continue;
      ctx.fillStyle = css(WOOD.post);
      for(let px = a + 2; px <= z - 2; px += 15) ctx.fillRect(px - 1.5, g.top - 12, 3, 12);
      ctx.fillStyle = css(WOOD.rail); ctx.fillRect(a, g.top - 12, z - a, 2.5); ctx.fillRect(a, g.top - 7, z - a, 2);
      if(e.snow > 0.2){ ctx.fillStyle = css(SNOW_LIT, e.snow); ctx.fillRect(a, g.top - 13.5, z - a, 1.8); }
    }
    // Damage meter above the far railing
    if(b.intact && b.hp < b.maxHp){
      const pct = b.hp / b.maxHp;
      ctx.fillStyle = 'rgba(14,10,6,0.75)'; ctx.fillRect(g.sx - 30, g.top - 26, 60, 7);
      ctx.fillStyle = pct > 0.5 ? '#c8a040' : '#d0502a'; ctx.fillRect(g.sx - 29, g.top - 25, 58 * pct, 5);
      ctx.strokeStyle = 'rgba(200,170,90,0.6)'; ctx.lineWidth = 0.8; ctx.strokeRect(g.sx - 30.5, g.top - 26.5, 61, 8);
    }
  }
}
// Near railing: drawn in depth order with the troops so it passes in front of their legs
function drawBridgeNearRail(b){
  const e = env, g = bridgeGeom(b);
  if(g.sx < -140 || g.sx > W + 140) return;
  const f = bridgeBuildFrac(b), stub = 12, fromRight = napoleon.retreating;
  const spans = f >= 1 ? [[g.l, g.r]]
    : fromRight ? [[g.l, g.l + stub], [g.r - stub - (g.bw - 2 * stub) * f, g.r]]
                : [[g.l, g.l + stub + (g.bw - 2 * stub) * f], [g.r - stub, g.r]];

    ctx.fillStyle = css(mix(WOOD.rail, '#ffffff', 0.25)); ctx.fillRect(a, top, z - a, 1);
    if(e.snow > 0.2){ ctx.fillStyle = css(SNOW_LIT, e.snow); ctx.fillRect(a, top - 1.5, z - a, 2); }
  }
}

// -- FIRE --
// Flickering tongues of flame along a base of width w; k = intensity 0..1
function drawFire(x, y, w, h, k, seed){
  if(k <= 0.01) return;
  drawGlow('#ff7a24', x, y - h * 0.35, w * 1.4 + 40, 0.6 * k);
  const prev = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  const n = Math.max(3, Math.round(w / 7)), lean = (env ? env.wind : 10) * 0.06 * (h / 30);
  const layers = [['#d8401a', 1, 0.75], ['#ff8a26', 0.72, 0.7], ['#ffe08a', 0.42, 0.75]];
  for(const [colr, sz, a] of layers){
    ctx.fillStyle = css(colr, a * Math.min(1, k * 1.4));
    for(let i = 0; i < n; i++){
      const u = n === 1 ? 0.5 : i / (n - 1);
      const t = gameTime * 0.011 + i * 2.3 + seed;
      const base = 0.45 + hash1((i * 13 + seed * 97) | 0) * 0.75;   // some tongues leap higher than others
      const fh = h * sz * base * (0.55 + 0.45 * Math.abs(Math.sin(t)) * Math.abs(Math.sin(t * 0.37 + 1))) * (1 - Math.abs(u - 0.5) * 0.6) * k;
      const fw = (w / n) * 1.7 * sz;
      const fx = x - w / 2 + u * w + Math.sin(gameTime * 0.007 + i * 1.7 + seed) * 2;
      const sway = lean + Math.sin(t * 1.3) * fh * 0.08;
      ctx.beginPath(); ctx.moveTo(fx - fw / 2, y);
      ctx.quadraticCurveTo(fx - fw * 0.55, y - fh * 0.55, fx + sway, y - fh);
      ctx.quadraticCurveTo(fx + fw * 0.55, y - fh * 0.55, fx + fw / 2, y);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = prev;
}

// -- FARMS --
// Russian farmsteads: log izba, timber barn, tower mill, thatched cottage, suburban house.
// Food left is shown by the crop patch; damage darkens and tilts; fire chars them.
function drawFarm(farm){
  const sx = Math.round(farm.x - camera.x), fy = farm.y || GROUND_Y + 16;

  const dmg = (3 - farm.farmHp) / 3;
  const char = farm.burning ? clamp01(1 - farm.burnTimer / 2500) : 0;

    ctx.beginPath(); ctx.moveTo(-13, -41); ctx.lineTo(0, -51); ctx.lineTo(13, -41); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-12, -22); ctx.lineTo(0, 0); ctx.moveTo(0, -22); ctx.lineTo(-12, 0); ctx.moveTo(0, -22); ctx.lineTo(12, 0); ctx.moveTo(12, -22); ctx.lineTo(0, 0); ctx.stroke(); }
    ctx.fillStyle = P('#1a0e08'); ctx.fillRect(-4, -36, 8, 6);

    if(snowRoof > 0.05){ ctx.fillStyle = css(SNOW_LIT, snowRoof); ctx.beginPath(); ctx.moveTo(-26, -27); ctx.lineTo(-13, -41); ctx.lineTo(0, -51); ctx.lineTo(13, -41); ctx.lineTo(26, -27); ctx.lineTo(24, -29); ctx.lineTo(12, -38.5); ctx.lineTo(0, -48); ctx.lineTo(-12, -38.5); ctx.lineTo(-24, -29); ctx.fill(); }
  } else if(t === 'windmill'){

    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-7.5, -36); ctx.lineTo(7.5, -36); ctx.lineTo(12, 0); ctx.fill();

    ctx.fillStyle = P('#5a4632'); for(let r = -32; r < 0; r += 5) ctx.fillRect(-11 + (-r) * 0.12, r, 22 - (-r) * 0.25, 0.8);
    ctx.fillStyle = P(looted ? '#100a06' : '#3a2616'); ctx.fillRect(-3.5, -10, 7, 10);
    ctx.fillStyle = P('#4a3426'); ctx.beginPath(); ctx.moveTo(-10, -35); ctx.quadraticCurveTo(0, -48, 10, -35); ctx.fill();
    if(snowRoof > 0.05){ ctx.fillStyle = css(SNOW_LIT, snowRoof); ctx.beginPath(); ctx.moveTo(-9, -36.5); ctx.quadraticCurveTo(0, -48, 9, -36.5); ctx.quadraticCurveTo(0, -44, -9, -36.5); ctx.fill(); }

// Onion dome on a drum. burnt: blackened, skin burned through to the ribs
function onionDome(x, baseY, r, colr, burnt, stripes){
  const y0 = baseY - r * 0.55;
  ctx.fillStyle = burnt ? '#2a1c16' : '#e8e0cc';
  ctx.fillRect(x - r * 0.55, y0, r * 1.1, r * 0.55);
  ctx.fillStyle = burnt ? '#120a08' : 'rgba(80,60,40,0.45)';
  for(let k = -1; k <= 1; k++) ctx.fillRect(x + k * r * 0.3 - 1, y0 + r * 0.12, 2, r * 0.3);
  const bulb = () => {
    ctx.beginPath(); ctx.moveTo(x - r * 0.55, y0);
    ctx.bezierCurveTo(x - r * 1.28, y0 - r * 0.5, x - r * 0.95, y0 - r * 1.4, x, y0 - r * 2.15);
    ctx.bezierCurveTo(x + r * 0.95, y0 - r * 1.4, x + r * 1.28, y0 - r * 0.5, x + r * 0.55, y0);
    ctx.closePath();
  };
  if(burnt){
    ctx.strokeStyle = '#120a08'; ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.beginPath();
    for(let k = -2; k <= 2; k++){ ctx.moveTo(x + k * r * 0.25, y0); ctx.quadraticCurveTo(x + k * r * 0.62, y0 - r * 1.1, x, y0 - r * 2.1); }
    ctx.stroke();
    ctx.save(); bulb(); ctx.clip();
    ctx.fillStyle = '#1e1410'; ctx.fillRect(x - r * 1.3, y0 - r * 1.05, r * 2.6, r * 1.1);
    ctx.restore();
    return;
  }
  const c = col(colr);
  const gr = ctx.createLinearGradient(x - r, 0, x + r, 0);
  gr.addColorStop(0, css(shade(c, 0.55))); gr.addColorStop(0.55, css(c)); gr.addColorStop(0.78, css(mix(c, '#ffffff', 0.45))); gr.addColorStop(1, css(shade(c, 0.8)));
  ctx.fillStyle = gr; bulb(); ctx.fill();
  if(stripes){
    ctx.save(); bulb(); ctx.clip();
    ctx.strokeStyle = css(stripes, 0.85); ctx.lineWidth = r * 0.22;
    ctx.beginPath();
    for(let k = -3; k <= 3; k++){ ctx.moveTo(x + k * r * 0.4, y0 + 2); ctx.quadraticCurveTo(x + k * r * 0.4 + r * 0.6, y0 - r * 1.1, x, y0 - r * 2.15); }
    ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = '#d8b040'; ctx.fillRect(x - 0.8, y0 - r * 2.15 - r * 0.7, 1.6, r * 0.75);
  ctx.fillRect(x - r * 0.28, y0 - r * 2.15 - r * 0.52, r * 0.56, 1.4);
  ctx.fillRect(x - r * 0.2, y0 - r * 2.15 - r * 0.3, r * 0.4, 1.1);
}

    for(let k = 0; k < 6; k++) drawSmokeColumn(ox + 20 + k * 92, wallTop - 70, 230, 26 + k % 3 * 6, 0.6 * Math.min(1, fireK * 1.2), '#241a16', k * 1.3, 1.2);
    if(burned) for(let k = 0; k < 5; k++) drawFire(ox + 10 + k * 108 + hash1(k * 9) * 30, wallTop + 2, 46, 30 + hash1(k) * 20, fireK * 0.7, k * 2.7);

    const pct = moscow.hp / moscow.maxHp, bx = gateX - 100, by = G - 150;
    ctx.fillStyle = 'rgba(14,10,8,0.72)'; ctx.beginPath(); ctx.roundRect(bx - 4, by - 4, 208, 20, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(212,168,72,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = pct > 0.5 ? '#c8a038' : pct > 0.25 ? '#d07020' : '#d02820'; ctx.fillRect(bx, by, 200 * pct, 12);
    ctx.fillStyle = '#fff4e0'; ctx.font = 'bold 9px Cinzel, serif'; ctx.textAlign = 'center'; ctx.fillText('MOSCOW', bx + 100, by + 9);
  }
  ctx.font = 'bold 15px Cinzel, serif'; ctx.textAlign = 'center';
  ctx.fillStyle = burned ? 'rgba(240,120,60,0.85)' : 'rgba(58,40,24,0.85)';

// -- SOLDIER SPRITES --
// Soldiers are painted once per pose/tint into small cached canvases (at 2x for
// crisp edges) and stamped with drawImage. Tints replace per-sprite ctx.filter.
const SPRITE_SCALE = 2;
const _spriteCache = new Map();
function getSprite(key, w, h, ox, oy, paint){
  let sp = _spriteCache.get(key);
  if(!sp){
    capCache(_spriteCache, 500);
    const c = makeCanvas(w * SPRITE_SCALE, h * SPRITE_SCALE), g = c.getContext('2d');
    g.scale(SPRITE_SCALE, SPRITE_SCALE); g.translate(ox, oy);
    paint(g);
    sp = { c, w, h, ox, oy };
    _spriteCache.set(key, sp);
  }
  return sp;
}
// Stamp a sprite with its origin at (x, y); dir -1 mirrors it; rot tips it over (radians)
function blit(sp, x, y, dir, rot){
  if(dir < 0 || rot){
    ctx.save(); ctx.translate(x, y);
    if(rot) ctx.rotate(rot);
    if(dir < 0) ctx.scale(-1, 1);
    ctx.drawImage(sp.c, -sp.ox, -sp.oy, sp.w, sp.h);
    ctx.restore();
  } else ctx.drawImage(sp.c, x - sp.ox, y - sp.oy, sp.w, sp.h);
}
// Tints: '' normal, 's1'..'s4' sickness, 'flash', 'frost' (frozen), 'dead' (disease death)
function tintCol(c, tint){
  if(!tint) return c;
  if(tint === 'flash') return mix(c, '#fffbf0', 0.82);
  if(tint === 'frost'){ const k = (col(c)[0] + col(c)[1] + col(c)[2]) / 765; return mix([40 + k * 170, 48 + k * 175, 58 + k * 180], '#7f9cc0', 0.42); }
  if(tint === 'dead') return shade(mix(c, '#6f8a52', 0.6), 0.75);
  if(tint === 'pale') return shade(mix(c, '#b8ab98', 0.5), 0.8);
  const k = +tint.slice(1) / 4;  // sickness: drained, jaundiced green
  return shade(mix(c, '#7aa83a', k * 0.55), 1 - k * 0.22);
}
const stroke = (g, w, colr, pts) => { g.strokeStyle = colr; g.lineWidth = w; g.beginPath(); g.moveTo(pts[0], pts[1]); for(let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.stroke(); };
const SKINS = ['#dcaa7c', '#c99a6c', '#b88860', '#e0b48e'];
const BLANKETS = ['#6e5c48', '#5a4c40', '#7a3e2c', '#5c6068'];

// Shared infantryman (facing +x, feet at 0,0). o: side 'fr'|'ru', frame 0-3, face, gear 0-2,
// plume, arms 'musket'|'thrust'|'none', tint
function paintInfantry(g, o){
  const T = c => css(tintCol(c, o.tint));
  const fr = o.side === 'fr';
  const coat = fr ? '#1f2f7c' : '#21592f', coatDk = fr ? '#141e52' : '#143c1f', coatLt = fr ? '#3346a0' : '#2f7442';
  const facing = fr ? '#ba221c' : '#b0261e';
  const trouser = o.gear === 2 ? '#9e9a8e' : '#d8d6cc', gaiter = '#16161a';
  const nearX = [3.2, 0.6, -3.2, -0.6][o.frame], bob = o.frame % 2 ? -1 : 0, hunch = o.gear === 2 ? 1.5 : 0;
  const hip = -11 + bob, ty = -24 + bob + hunch * 0.6, by = -10 + bob;
  g.lineCap = 'butt';
  // Far leg, kit on the back, then the near leg
  stroke(g, 3.4, T(shade(trouser, 0.8)), [-0.5, hip, -nearX, -4]);
  stroke(g, 3.6, T(gaiter), [-nearX * 0.55 - 0.3, -6.5, -nearX, -0.6]);
  g.fillStyle = T(gaiter); g.fillRect(-nearX - 1.2, -1.6, 3.8, 1.7);
  if(fr){
    g.fillStyle = T('#5c3c22'); g.fillRect(-10, ty + 1.5, 5, 9.5);                // calfskin knapsack
    g.fillStyle = T('#3a2614'); g.fillRect(-10, ty + 1.5, 1.2, 9.5);
    g.fillStyle = T('#a09276'); g.beginPath(); g.roundRect(-11, ty - 1.5, 7.5, 3.6, 1.6); g.fill(); // rolled greatcoat
  } else {
    g.fillStyle = T('#1a1a1a'); g.fillRect(-9.5, ty + 2, 4.5, 8.5);
  }
  // Coat tails with turnbacks
  g.fillStyle = T(coat); g.beginPath(); g.moveTo(-5, by - 3); g.lineTo(-7.2, by + 3.5); g.lineTo(-2, by + 0.5); g.fill();
  g.fillStyle = T(facing); g.fillRect(-6.8, by + 1, 2.6, 2.2);
  stroke(g, 3.6, T(trouser), [0.5, hip, nearX, -4]);
  stroke(g, 3.8, T(gaiter), [nearX * 0.55 + 0.3, -6.5, nearX, -0.6]);
  g.fillStyle = T(gaiter); g.fillRect(nearX - 1.2, -1.6, 3.9, 1.7);
  if(o.gear === 2){ g.fillStyle = T('#8a7a62'); g.fillRect(nearX - 1.6, -3.6, 4.4, 2.6); g.fillRect(-nearX - 1.6, -3.4, 4.2, 2.4); } // rag-wrapped feet
  // Torso, lit from the front
  g.fillStyle = T(coat); g.fillRect(-5, ty, 10, by - ty + 0.5);
  g.fillStyle = T(coatDk); g.fillRect(-5, ty, 2.6, by - ty + 0.5);
  g.fillStyle = T(coatLt); g.fillRect(3.6, ty + 1, 1.4, by - ty - 1);
  if(fr){ g.fillStyle = T('#e9e6dc'); g.fillRect(1.6, ty + 2.2, 2.6, 8.5); }       // white lapels
  else { g.fillStyle = T('#d8d0b0'); g.fillRect(-1, by - 3.2, 6, 1.6); }            // belt
  g.fillStyle = T(facing); g.fillRect(-1.5, ty - 0.2, 6.5, 2.3);                    // collar
  stroke(g, 1.5, T('#ecebe4'), [4.2, ty + 1, -4.2, by - 1.2]);                       // crossbelt
  if(!fr) stroke(g, 2.6, T('#a49a80'), [-4.5, ty + 0.5, 4.5, by - 1]);               // rolled greatcoat, bandolier-style
  g.fillStyle = T('#141414'); g.fillRect(-6.8, by - 4.2, 4, 3.6);                    // cartridge box
  if(fr){ g.fillStyle = T('#c8201c'); g.fillRect(-1.2, ty - 0.8, 5.2, 1.8); g.fillStyle = T('#e8a020'); g.fillRect(-1.2, ty + 0.8, 5.2, 0.9); }
  // Winter: scarf, then a blanket thrown over the shoulders
  if(o.gear >= 1){ g.fillStyle = T(o.face % 2 ? '#8a2c22' : '#5a4a3a'); g.fillRect(-2.5, ty - 1.6, 7.5, 3); g.fillRect(-3.5, ty + 0.5, 2.5, 4.5); }
  if(o.gear === 2){
    const bl = BLANKETS[o.face % BLANKETS.length];
    g.fillStyle = T(bl);
    g.beginPath(); g.moveTo(-6, ty - 3.5); g.quadraticCurveTo(0, ty - 5.5, 4.4, ty - 1); g.quadraticCurveTo(5.4, ty + 4, 4, ty + 7);
    g.lineTo(1.5, ty + 5.5); g.lineTo(-0.5, ty + 8); g.lineTo(-2.5, ty + 6.5); g.lineTo(-5, ty + 10.5); g.lineTo(-7.5, ty + 9);
    g.lineTo(-10.5, ty + 12.5); g.quadraticCurveTo(-12.5, ty + 3, -6, ty - 3.5); g.closePath(); g.fill();
    g.strokeStyle = T(shade(bl, 0.7)); g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(-3, ty - 2); g.quadraticCurveTo(-5, ty + 4, -7.5, ty + 8.5); g.moveTo(1, ty - 2.5); g.quadraticCurveTo(0.5, ty + 2, -0.5, ty + 7.5); g.stroke();
    g.fillStyle = T('#eef3f8'); g.fillRect(-10, ty - 2.6, 9, 1.4);                  // snow on the shoulders
  }
  // Weapon and the arm that carries it
  const hand = [4.6, ty + 10.5];
  if(o.arms === 'musket'){
    stroke(g, 2.2, T('#5a3a1e'), [3.6, by + 1.5, 6, by - 10]);
    stroke(g, 1.3, T('#4c4e56'), [6, by - 10, 8.2, ty - 19]);
    stroke(g, 0.9, T('#d4d8dc'), [8.2, ty - 19, 9, ty - 26]);
  } else if(o.arms === 'thrust'){
    hand[0] = 8; hand[1] = ty + 7;
    stroke(g, 2.2, T('#5a3a1e'), [-1, ty + 9, 7, ty + 7]);
    stroke(g, 1.3, T('#4c4e56'), [7, ty + 7, 17, ty + 5.5]);
    stroke(g, 0.9, T('#e4e8ec'), [17, ty + 5.5, 23, ty + 4.8]);
  }
  stroke(g, 3, T(o.gear === 2 ? BLANKETS[o.face % BLANKETS.length] : coat), [0.5, ty + 1.5, hand[0] - 0.4, hand[1] - 0.6]);
  g.fillStyle = T(facing); g.fillRect(hand[0] - 1.6, hand[1] - 2.2, 2.6, 1.8);
  g.fillStyle = T(SKINS[o.face]); g.fillRect(hand[0] - 0.8, hand[1] - 0.6, 2.6, 2.4);
  // Head
  const hy = ty - 8 + hunch * 0.4;
  g.fillStyle = T(SKINS[o.face]); g.fillRect(-2.4, hy, 6.4, 8);
  g.fillStyle = T(shade(SKINS[o.face], 0.82)); g.fillRect(-2.4, hy + 5.5, 6.4, 2.5);
  g.fillStyle = T('#3a2818'); g.fillRect(-3, hy + 0.6, 2.2, 5.4);
  g.fillStyle = T('#16100c'); g.fillRect(2.4, hy + 2.6, 1.1, 1.2);
  if(o.face >= 2){ g.fillStyle = T('#3a2818'); g.fillRect(1.4, hy + 5.2, 3.2, 1.1); }  // moustache
  if(o.gear === 2){ g.fillStyle = T('#e8eef4'); g.fillRect(1.2, hy + 6.4, 3, 1); }     // frost in the beard
  // Shako (French) / kiver (Russian)
  const sy = hy - 12;
  g.fillStyle = T('#141418');
  g.beginPath(); g.moveTo(-4.2, sy + 12); g.lineTo(-4.6, sy); g.lineTo(4.8, sy); g.lineTo(4.4, sy + 12); g.fill();
  g.fillStyle = T('#2c2c36'); g.fillRect(2.6, sy + 0.5, 1.8, 11.5);
  g.fillStyle = T('#c9a23e');
  if(fr){ g.beginPath(); g.moveTo(3.4, sy + 3.8); g.lineTo(5, sy + 6.4); g.lineTo(3.4, sy + 9); g.lineTo(1.8, sy + 6.4); g.fill(); }
  else { g.fillRect(1.8, sy + 4.5, 3, 3.6); g.fillStyle = T('#d8d8cc'); g.fillRect(-4.4, sy + 1, 9, 1); }
  g.fillStyle = T(fr ? '#e2e0d6' : '#2f7442'); g.fillRect(-4.3, sy + 10.4, 8.8, 1.2);
  g.fillStyle = T('#0b0b0e'); g.fillRect(1, sy + 11.4, 6.6, 1.7);                     // peak
  if(fr){ g.fillStyle = T('#2846b0'); g.fillRect(-0.6, sy + 0.4, 2.6, 2.6); g.fillStyle = T('#f2f2ee'); g.fillRect(-0.1, sy + 0.9, 1.6, 1.6); g.fillStyle = T('#c81c1c'); g.fillRect(0.35, sy + 1.35, 0.7, 0.7); }
  g.fillStyle = T(o.plume);
  if(fr){ g.beginPath(); g.ellipse(1.1, sy - 3.4, 1.5, 3.6, 0.1, 0, TAU); g.fill(); }
  else { g.beginPath(); g.arc(1.2, sy - 1.6, 1.8, 0, TAU); g.fill(); }
  if(o.gear === 2){ g.fillStyle = T('#f0f4f8'); g.fillRect(-4.6, sy - 1.2, 9.4, 1.6); }
}

// A soldier lying where the cold took him (head toward +x), half under a drift
function paintFrozenBody(g, face, bury){
  g.fillStyle = css(SNOW_SH, 0.55); g.beginPath(); g.ellipse(0, 0, 28, 4.5, 0, 0, TAU); g.fill();
  stroke(g, 1.4, '#3a2c22', [-24, -2, 10, -6]);                                 // dropped musket
  g.fillStyle = '#4a5874'; g.beginPath(); g.roundRect(-17, -9, 30, 8, 3.5); g.fill();  // greatcoat, frosted blue-grey
  g.fillStyle = '#5c6c8a'; g.fillRect(-15, -9, 26, 2.2);
  g.fillStyle = '#6a5a4a'; g.beginPath(); g.ellipse(-4, -9, 9, 2.6, 0, Math.PI, 0); g.fill(); // blanket
  stroke(g, 1, '#c8d4e2', [4, -8.5, -6, -1.5]);                                   // crossbelt
  g.fillStyle = '#9fb2c8'; g.beginPath(); g.arc(16, -5, 3.6, 0, TAU); g.fill();     // face, pale with frost
  g.fillStyle = '#2a2a30'; g.fillRect(14.5, -9, 4, 2);
  g.save(); g.translate(24, -3); g.rotate(1.2); g.fillStyle = '#16161c'; g.fillRect(-3.5, -5, 7, 9); g.fillStyle = '#c81c1c'; g.fillRect(-1, -8, 2, 3); g.restore(); // fallen shako
  g.fillStyle = '#ffffff'; g.globalAlpha = 0.7; for(let k = 0; k < 6; k++) g.fillRect(-14 + k * 5, -9 + (k % 2), 1, 1); g.globalAlpha = 1;
  // The drift: rounded, lit from above, covering the legs and more of him as winter deepens
  const reach = -22 + bury * 26;
  g.fillStyle = css(SNOW_SH); g.beginPath(); g.moveTo(-30, 0.5);
  g.quadraticCurveTo(-26, -9 - bury * 3, (reach - 30) / 2, -10 - bury * 3); g.quadraticCurveTo(reach, -9 - bury * 2, reach + 6, 0.5); g.closePath(); g.fill();
  g.fillStyle = '#f3f6fa'; g.beginPath(); g.moveTo(-29, -1);
  g.quadraticCurveTo(-25, -10 - bury * 3, (reach - 30) / 2, -11 - bury * 3); g.quadraticCurveTo(reach - 2, -10 - bury * 2, reach + 3, -2);
  g.quadraticCurveTo((reach - 30) / 2, -4, -29, -1); g.fill();
}

function infantrySprite(o){
  const key = `${o.side}${o.frame}${o.face}${o.gear}${o.arms}${o.plume}${o.tint}`;
  return getSprite(key, 38, 58, 13, 54, g => paintInfantry(g, o));
}
const PLUMES = { vanguard:'#f2f2ee', column:'#c81c1c', raider:'#e09a10', worker:'#c81c1c' };
function frenchGear(){ return temperature < -15 ? 2 : temperature < -3 ? 1 : 0; }
function soldierShadow(x, y, w){
  ctx.fillStyle = 'rgba(20,16,10,0.26)';
  ctx.beginPath(); ctx.ellipse(x, y, w, w * 0.3, 0, 0, TAU); ctx.fill();
}

function drawFrenchSoldier(s){
  if(!s.alive && !s.dying && !s.frozenBody) return;
  const sx = Math.round(s.x - camera.x), sy = Math.round(s.y);
  if(sx < -40 || sx > W + 40) return;
  const face = (s.id * 1000 | 0) % 4, plume = PLUMES[s.role] || PLUMES.column;
  const dir = s.facing || 1;
  if(s.frozenBody){
    // Frozen where he fell, slowly buried by drifting snow
    const bury = Math.round((0.4 + 0.6 * env.snow) * 3);
    const sp = getSprite(`body${face}${bury}`, 64, 22, 32, 18, g => paintFrozenBody(g, face, bury / 3));
    blit(sp, sx, sy, dir, 0);
    return;
  }
  let tint = '', rot = 0, alpha = 1;
  if(s.dying){
    const dur = s.deathType === 'freeze' || s.deathType === 'starve' ? 1500 : s.deathType === 'combat' ? 800 : 2000;
    const k = clamp01(s.dyingMs / dur);
    tint = s.deathType === 'freeze' ? 'frost' : s.deathType === 'disease' ? 'dead' : s.deathType === 'starve' ? 'pale' : '';
    rot = dir * Math.min(Math.PI / 2, (1 - k) * Math.PI / 1.6);
    alpha = s.deathType === 'freeze' ? 1 : Math.min(1, k * 1.6);
  } else if(s.diseased && s.sickness > 0.05) tint = 's' + Math.min(4, 1 + (s.sickness * 4 | 0));
  if(s.flash > 0) tint = 'flash';
  const lunge = !s.dying && s.lungeAt !== undefined && gameTime - s.lungeAt < 220;
  const frame = s.dying ? 1 : Math.floor(s.walkTimer / 150) % 4;
  const arms = s.role === 'worker' ? 'none' : lunge ? 'thrust' : 'musket';
  const sp = infantrySprite({ side:'fr', frame, face, gear: frenchGear(), arms, plume, tint });
  ctx.globalAlpha = alpha;
  soldierShadow(sx, sy, 9);
  if(s.role === 'raider' && s.carrying && s.carryFood > 0) drawHandcart(sx - dir * 17, sy, dir, s.carryFood / 20, s.walkTimer);
  blit(sp, sx + (lunge ? dir * 3 : 0), sy, dir, rot);
  if(s.role === 'worker' && !s.dying) drawWorkerTools(s, sx, sy, dir);
  ctx.globalAlpha = 1;
  if(s.exclamTimer > 0){
    const pulse = Math.sin(gameTime * 0.025) * 0.15 + 0.85;
    ctx.globalAlpha = Math.min(1, s.exclamTimer / 300) * pulse;
    ctx.fillStyle = '#ee2a20'; ctx.font = 'bold 17px Cinzel, serif'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(30,8,4,0.8)'; ctx.lineWidth = 3;
    ctx.strokeText('!', sx, sy - 60); ctx.fillText('!', sx, sy - 60);
    ctx.globalAlpha = 1;
  }
}
// Bridge workers swing hammers and carry planks
function drawWorkerTools(s, sx, sy, dir){
  ctx.save(); ctx.translate(sx + dir * 5, sy - 30);
  ctx.rotate(dir * (s.hammerAngle || 0));
  ctx.fillStyle = '#6a4a24'; ctx.fillRect(-0.8, -14, 1.8, 16);
  ctx.fillStyle = '#7a7c82'; ctx.fillRect(-3.5, -16, 7, 4);
  ctx.restore();
  ctx.save(); ctx.translate(sx - dir * 2, sy - 18); ctx.rotate(dir * 0.25);
  ctx.fillStyle = '#9a7244'; ctx.fillRect(-13, -2, 26, 4);
  ctx.fillStyle = '#6a4a2a'; ctx.fillRect(-13, 1, 26, 1);
  ctx.restore();
}
// A forager's handcart, heaped according to its load (0..1)
function drawHandcart(x, y, dir, load, t){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(20,16,10,0.22)'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 3, 0, 0, TAU); ctx.fill();
  stroke(ctx, 1.6, '#5a3a1a', [dir * 8, -9, dir * 16, -15]);
  ctx.fillStyle = '#7a5428'; ctx.fillRect(-10, -12, 20, 6);
  ctx.fillStyle = '#5a3a18'; ctx.fillRect(-10, -7, 20, 1.5);
  const lh = 3 + load * 9;
  ctx.fillStyle = '#c9a54a'; ctx.beginPath(); ctx.ellipse(-3, -12, 6, lh * 0.6, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#b08a3a'; ctx.beginPath(); ctx.ellipse(4, -12, 5, lh * 0.5, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -4.5, 4.5, 0, TAU); ctx.stroke();
  const a = t * 0.01 * dir;
  ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 4, -4.5 + Math.sin(a) * 4); ctx.lineTo(-Math.cos(a) * 4, -4.5 - Math.sin(a) * 4); ctx.stroke();
  ctx.restore();
}

function drawRussianSoldier(s){
  if(!s.alive && !s.dying) return;
  const sx = Math.round(s.x - camera.x), sy = Math.round(s.y);
  if(sx < -40 || sx > W + 40) return;
  const face = (s.id * 1000 | 0) % 4, dir = s.facing || -1;
  let rot = 0, alpha = 1;
  if(s.dying){ const k = clamp01(s.dyingMs / 800); rot = -dir * Math.min(Math.PI / 2, (1 - k) * Math.PI / 1.6); alpha = Math.min(1, k * 1.6); }
  const lunging = s.atkTimer > 0 && !s.dying;
  const frame = s.dying ? 1 : Math.floor(s.walkTimer / 140) % 4;
  const sp = infantrySprite({ side:'ru', frame, face, gear: temperature < -12 ? 1 : 0, arms: lunging ? 'thrust' : 'musket', plume:'#e8e0c0', tint: s.flash > 0 ? 'flash' : '' });
  ctx.globalAlpha = alpha;
  if(s.controlled && !s.dying){
    // Gold command marker: pulsing ring at the feet and a chevron overhead
    const pulse = 0.6 + Math.sin(gameTime * 0.008) * 0.25;
    drawGlow('#ffcf4a', sx, sy, 22, 0.35 * pulse);
    ctx.strokeStyle = `rgba(255,214,90,${0.55 + pulse * 0.4})`; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(sx, sy, 13, 4.2, 0, 0, TAU); ctx.stroke();
    const cy = sy - 64 + Math.sin(gameTime * 0.006) * 2;
    ctx.fillStyle = '#ffd25a'; ctx.strokeStyle = 'rgba(40,24,0,0.8)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(sx - 5, cy - 3); ctx.lineTo(sx, cy + 3); ctx.lineTo(sx + 5, cy - 3); ctx.lineTo(sx + 5, cy - 6); ctx.lineTo(sx, cy); ctx.lineTo(sx - 5, cy - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  soldierShadow(sx, sy, 9);
  blit(sp, sx + (lunging ? dir * 4 : 0), sy, dir, rot);
  ctx.globalAlpha = 1;
}
// -- HORSES --
// Side-view horse facing +x with its hooves on (0,0). gait: walk-cycle phase (radians), moving: legs swing
const GREY_HORSE = { body:'#d6d2ca', shade:'#a9a49b', mane:'#8c877f', hoof:'#3a3632', lower:'#bcb7ae' };
const BAY_HORSE = { body:'#7c4c2a', shade:'#58341a', mane:'#1e1410', hoof:'#141010', lower:'#2a1c14' };
function drawHorse(g, s, gait, moving, c, gaunt){
  const leg = (x, ph, near) => {
    const sw = moving ? Math.sin(gait + ph) * 5.5 * s : 0;
    const lift = moving ? Math.max(0, Math.cos(gait + ph)) * 3.2 * s : 0;
    const top = -19 * s, knee = -9 * s - lift * 0.4;
    g.lineCap = 'round';
    g.strokeStyle = css(near ? c.body : c.shade); g.lineWidth = 3.6 * s;
    g.beginPath(); g.moveTo(x, top); g.lineTo(x + sw * 0.5, knee); g.stroke();
    g.strokeStyle = css(near ? c.lower : shade(c.lower, 0.8)); g.lineWidth = 2.1 * s;
    g.beginPath(); g.moveTo(x + sw * 0.5, knee); g.lineTo(x + sw, -1.4 * s - lift); g.stroke();
    g.lineCap = 'butt';
    g.fillStyle = css(c.hoof); g.fillRect(x + sw - 1.5 * s, -1.8 * s - lift, 3.2 * s, 1.9 * s);
  };
  leg(9 * s, Math.PI, false); leg(-10 * s, 0, false);
  // Tail
  const tailSw = Math.sin(gameTime * 0.003) * 2 * s;
  g.strokeStyle = css(c.mane); g.lineWidth = 3.4 * s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-16 * s, -28 * s); g.quadraticCurveTo(-23 * s, -24 * s, -21 * s + tailSw, -10 * s); g.stroke();
  g.lineCap = 'butt';
  // Barrel, chest and quarters
  g.fillStyle = css(c.body);
  g.beginPath(); g.ellipse(0, -25 * s, 15 * s, (gaunt ? 6.6 : 7.8) * s, 0, 0, TAU); g.fill();
  g.beginPath(); g.arc(-10.5 * s, -26 * s, 8 * s, 0, TAU); g.fill();
  g.beginPath(); g.arc(10.5 * s, -25 * s, 7.4 * s, 0, TAU); g.fill();
  g.fillStyle = css(c.shade);
  g.beginPath(); g.ellipse(0, -19.5 * s, 13 * s, 2.6 * s, 0, 0, TAU); g.fill();
  if(gaunt){ g.strokeStyle = css(shade(c.body, 0.8)); g.lineWidth = 0.8 * s; for(let r = 0; r < 3; r++){ g.beginPath(); g.moveTo((-3 + r * 3) * s, -29 * s); g.lineTo((-4 + r * 3) * s, -21 * s); g.stroke(); } }
  // Neck with a crested mane, then the head (nodding with the stride)
  const nod = moving ? Math.sin(gait * 2) * 1.2 * s : Math.sin(gameTime * 0.002) * 0.6 * s;
  g.fillStyle = css(c.body);
  g.beginPath(); g.moveTo(5 * s, -31 * s); g.quadraticCurveTo(12 * s, -40 * s, 18 * s, -44 * s + nod);
  g.lineTo(23 * s, -36 * s + nod); g.quadraticCurveTo(17 * s, -27 * s, 15.5 * s, -20 * s); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(17.5 * s, -44.5 * s + nod);
  g.quadraticCurveTo(24 * s, -44.5 * s + nod, 30 * s, -36 * s + nod);
  g.quadraticCurveTo(31 * s, -33 * s + nod, 28.4 * s, -32.6 * s + nod);
  g.quadraticCurveTo(25 * s, -33.5 * s + nod, 21.5 * s, -35.5 * s + nod); g.closePath(); g.fill();
  g.fillStyle = css(c.shade); g.beginPath(); g.ellipse(28 * s, -34 * s + nod, 2.2 * s, 1.6 * s, 0.6, 0, TAU); g.fill();
  g.fillStyle = css(c.body); g.beginPath(); g.moveTo(17.6 * s, -44 * s + nod); g.lineTo(18.6 * s, -48.5 * s + nod); g.lineTo(20.2 * s, -44 * s + nod); g.fill();
  g.strokeStyle = css(c.mane); g.lineWidth = 2.2 * s;
  g.beginPath(); g.moveTo(5 * s, -32 * s); g.quadraticCurveTo(11.5 * s, -41 * s, 18 * s, -45 * s + nod); g.stroke();
  g.fillStyle = '#141010'; g.fillRect(22.4 * s, -41.2 * s + nod, 1.3 * s, 1.3 * s);
  leg(11 * s, 0, true); leg(-8 * s, Math.PI, true);
}

// -- NAPOLEON --
const HS = 1.3; // the Emperor's grey is drawn larger than the draught horses
function napoleonMoving(){
  return !napoleon.stopped && !napoleon.atMoscow && (phase === 'playing' || phase === 'retreat' || phase === 'burned');
}
function drawNapoleon(){
  const sx = Math.round(napoleon.x - camera.x), sy = GROUND_Y + 35;
  if(sx < -80 || sx > W + 80) return;
  const dir = napoleon.retreating ? -1 : 1, moving = napoleonMoving();
  const gait = gameTime * 0.009, cold = frenchGear();
  const bob = moving ? Math.abs(Math.sin(gait)) * 1.5 : 0;
  drawEagleBearer(sx - dir * 36, sy - 8, dir, moving);
  ctx.fillStyle = 'rgba(20,16,10,0.3)'; ctx.beginPath(); ctx.ellipse(sx + dir * 4, sy, 30, 6, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(sx, sy); ctx.scale(dir, 1);
  drawHorse(ctx, HS, gait, moving, GREY_HORSE, cold === 2);
  // Saddle cloth: crimson with gold lace
  ctx.fillStyle = '#7a1418'; ctx.beginPath(); ctx.roundRect(-11, -42, 18, 14, 2); ctx.fill();
  ctx.fillStyle = '#d4a838'; ctx.fillRect(-11, -29.5, 18, 1.5); ctx.fillRect(-11, -42, 1.4, 13);
  // Rider (sits slightly back, rises with the horse's stride)
  const ry = -41 - bob;
  ctx.fillStyle = '#e4e2da'; ctx.fillRect(-2, ry - 1, 5, 8);                         // white breeches
  ctx.fillStyle = '#121214'; ctx.fillRect(-1, ry + 5, 4.5, 14);                      // riding boot
  ctx.fillStyle = '#2a2a2e'; ctx.fillRect(-1, ry + 5, 4.5, 2);
  const coat = cold >= 1 ? '#6e6a62' : '#8c8a84';
  ctx.fillStyle = coat;                                                              // redingote grise
  ctx.beginPath(); ctx.moveTo(-6, ry); ctx.lineTo(-5, ry - 17); ctx.lineTo(4, ry - 17); ctx.lineTo(6, ry); ctx.lineTo(1, ry + 4); ctx.lineTo(-8, ry + 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shadeCss(coat, 0.78); ctx.fillRect(-6, ry - 16, 2.5, 16);
  ctx.fillStyle = '#1c2a6a'; ctx.fillRect(1.5, ry - 16, 2.6, 10);                    // chasseur uniform beneath
  ctx.fillStyle = '#e8e8e2'; ctx.fillRect(1.5, ry - 6.5, 2.6, 4);                    // waistcoat
  ctx.fillStyle = '#c42020'; ctx.fillRect(-1, ry - 13, 2.5, 2);                      // Légion d'honneur
  if(cold === 2){ ctx.fillStyle = '#4e3a2a'; ctx.beginPath(); ctx.moveTo(-8, ry - 18); ctx.lineTo(6, ry - 18); ctx.lineTo(7, ry - 9); ctx.lineTo(-9, ry - 4); ctx.fill(); ctx.fillStyle = '#7a6650'; ctx.fillRect(-8, ry - 19, 14, 3); } // fur pelisse
  stroke(ctx, 3, coat, [2, ry - 14, 8, ry - 8, 12, ry - 9]);                         // arm on the reins
  ctx.fillStyle = '#d8b088'; ctx.fillRect(11, ry - 10.5, 2.5, 2.5);
  stroke(ctx, 0.8, '#2a1a10', [13, ry - 9, 36, -43]);                                // reins
  ctx.fillStyle = '#dcae84'; ctx.fillRect(-2, ry - 25, 6.5, 8);                      // head
  ctx.fillStyle = '#c0946c'; ctx.fillRect(-2, ry - 20, 6.5, 3);
  ctx.fillStyle = '#16100c'; ctx.fillRect(3, ry - 22.5, 1.1, 1.1);
  ctx.fillStyle = '#e8e6e0'; ctx.fillRect(-1, ry - 17.5, 5, 2);                      // cravat
  // Bicorne worn "en bataille", side-on
  ctx.fillStyle = '#0c0c14';
  ctx.beginPath(); ctx.moveTo(-10, ry - 24); ctx.quadraticCurveTo(-4, ry - 26, 0.5, ry - 33); ctx.quadraticCurveTo(5, ry - 26, 11, ry - 24);
  ctx.quadraticCurveTo(0.5, ry - 22, -10, ry - 24); ctx.fill();
  ctx.fillStyle = '#26263a'; ctx.fillRect(-9, ry - 24.6, 19, 1);
  ctx.fillStyle = '#2846b0'; ctx.beginPath(); ctx.arc(3.5, ry - 27, 2.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f2f2ee'; ctx.beginPath(); ctx.arc(3.5, ry - 27, 1.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c81c1c'; ctx.beginPath(); ctx.arc(3.5, ry - 27, 0.6, 0, TAU); ctx.fill();
  if(cold === 2){ ctx.fillStyle = '#eef3f8'; ctx.fillRect(-7, ry - 26.5, 15, 1.4); }
  ctx.restore();
  // Name plate
  const ly = sy - 98 - bob;
  ctx.font = 'bold 9px Cinzel, serif'; ctx.textAlign = 'center';
  const tw = ctx.measureText('NAPOLÉON').width + 12;
  ctx.fillStyle = 'rgba(14,12,20,0.62)'; ctx.beginPath(); ctx.roundRect(sx - tw / 2, ly - 10, tw, 14, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(212,168,56,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#f2cf6a'; ctx.fillText('NAPOLÉON', sx, ly + 1);
}
const shadeCss = (c, k) => css(shade(c, k));

// The regiment's Eagle: a bearer walking beside the Emperor with the tricolour flying
function drawEagleBearer(x, y, dir, moving){
  if(!napoleon.soldiers.some(s => s.alive && !s.dying)) return;
  const frame = moving ? Math.floor(gameTime / 150) % 4 : 1;
  const sp = infantrySprite({ side:'fr', frame, face:1, gear: frenchGear(), arms:'none', plume:'#c81c1c', tint:'' });
  soldierShadow(x, y, 9);
  blit(sp, x, y, dir, 0);
  const px = x + dir * 5, top = y - 78;
  ctx.fillStyle = '#4a3420'; ctx.fillRect(px - 1, top, 2, 62);
  // Flag: vertical strips displaced by a travelling wave; tattered in the retreat
  const tatters = napoleon.retreating ? env.rp : 0;
  const fw = 30, fh = 20, n = 15;
  const flow = env.wind - (moving ? dir * napoleon.speed : 0) >= 0 ? 1 : -1;  // streams with the apparent wind
  for(let i = 0; i < n; i++){
    const u = i / n, u2 = (i + 1) / n;
    if(tatters > 0.3 && u > 1 - tatters * 0.45 && (i % 3 === 1)) continue;
    const wave = k => Math.sin(gameTime * 0.008 - k * 6) * 3.2 * k;
    const x0 = px + flow * u * fw, x1 = px + flow * u2 * fw;
    const y0 = top + 4 + wave(u), y1 = top + 4 + wave(u2);
    const hBot = fh * (1 - tatters * 0.3 * u);
    const colr = u < 1 / 3 ? '#2a46a8' : u < 2 / 3 ? '#f0eee6' : '#c4201e';
    const lit = 0.85 + 0.15 * Math.cos(gameTime * 0.008 - u * 6);
    ctx.fillStyle = css(shade(colr, lit));
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 + flow * 0.4, y1); ctx.lineTo(x1 + flow * 0.4, y1 + hBot); ctx.lineTo(x0, y0 + hBot); ctx.fill();
  }
  // Gilded eagle atop the staff
  ctx.fillStyle = napoleon.retreating ? '#a8862e' : '#e0b43c';
  ctx.beginPath(); ctx.ellipse(px, top - 3, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px - 6, top - 6); ctx.lineTo(px - 1, top - 2); ctx.lineTo(px + 1, top - 2); ctx.lineTo(px + 6, top - 6); ctx.lineTo(px + 4, top - 1); ctx.lineTo(px - 4, top - 1); ctx.fill();
  ctx.fillRect(px - 3, top - 0.5, 6, 2);
}

// -- SUPPLY WAGONS --
function drawWagon(i){
  const foodRatio = Math.max(0, napoleon.food / napoleon.maxFood);
  const abandoned = napoleon.retreating, moving = !abandoned && napoleonMoving();
  {
    const wag = napoleon.wagons[i];
    const sx = Math.round(wag.x - camera.x), sy = GROUND_Y + 44 + wag.offsetZ;
    if(sx < -110 || sx > W + 110) return;
    const load = Math.max(0, foodRatio - i * 0.08);
    ctx.save(); ctx.translate(sx, sy);
    if(abandoned){
      // Left in the snow: tipped over, a wheel gone, slowly buried
      ctx.fillStyle = 'rgba(20,16,10,0.22)'; ctx.beginPath(); ctx.ellipse(0, 4, 30, 5, 0, 0, TAU); ctx.fill();
      ctx.rotate(-0.12 + i * 0.05);
      drawWagonBody(0, load * 0.3, false);
      ctx.rotate(0.12 - i * 0.05);
      const sn = env.snow;
      ctx.fillStyle = css(SNOW_SH, 0.7 * sn); ctx.beginPath(); ctx.ellipse(2, 3, 34, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = css('#f2f5f9', 0.95 * sn);
      ctx.beginPath(); ctx.moveTo(-23, -19); ctx.quadraticCurveTo(-14, -27 - sn * 5, -2, -23 - sn * 2); ctx.quadraticCurveTo(10, -28 - sn * 5, 23, -19); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-30, 4); ctx.quadraticCurveTo(-10, -6 * sn, 8, -2); ctx.quadraticCurveTo(24, -4 * sn, 34, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
      return;
    }
    ctx.fillStyle = 'rgba(20,16,10,0.25)'; ctx.beginPath(); ctx.ellipse(28, 5, 58, 6, 0, 0, TAU); ctx.fill();
    // Pair of draught horses in harness
    const gait = gameTime * 0.008 + i * 1.7;
    ctx.save(); ctx.translate(60, 1); drawHorse(ctx, 1, gait + 0.6, moving, BAY_HORSE, false); ctx.restore();
    stroke(ctx, 1.2, '#2a1a0e', [22, -12, 44, -22, 66, -24]);
    ctx.save(); ctx.translate(55, 6); drawHorse(ctx, 1, gait, moving, BAY_HORSE, false); ctx.restore();
    ctx.fillStyle = '#3a2614'; ctx.fillRect(50, 5 - 32, 14, 3);
    drawWagonBody(wag.wobble, load, true);
    ctx.restore();
  }
}
// Open supply wagon (origin at the ground under its centre); load 0..1 heaps sacks and barrels
function drawWagonBody(roll, load, wheels){
  const g = ctx;
  if(wheels) wagonWheel(-13, 0, roll, 9, true);
  g.fillStyle = '#5c3e22'; g.fillRect(-22, -17, 44, 10);
  g.fillStyle = '#74512c'; g.fillRect(-22, -21, 44, 4); g.fillRect(-22, -10, 44, 3);
  g.fillStyle = '#3e2814'; for(let p = -18; p < 22; p += 8) g.fillRect(p, -21, 1.2, 14);
  if(load > 0.04){
    const lh = 3 + load * 13;
    g.fillStyle = '#c4a050';
    for(let k = 0; k < 4; k++){ g.beginPath(); g.ellipse(-14 + k * 9, -21, 5.5, lh * (0.75 + (k % 2) * 0.25), 0, Math.PI, 0); g.fill(); }
    g.fillStyle = '#a8843c'; g.fillRect(-18, -22, 36, 1.6);
    if(load > 0.5){ g.fillStyle = '#7a4a24'; g.beginPath(); g.ellipse(-10, -21 - lh * 0.6, 4.5, 5.5, 0, 0, TAU); g.fill(); g.fillStyle = '#4a2c14'; g.fillRect(-14.5, -23 - lh * 0.6, 9, 1.2); g.fillRect(-14.5, -19.5 - lh * 0.6, 9, 1.2); }
  }
  g.fillStyle = '#4a3018'; g.fillRect(-24, -20, 3, 13); g.fillRect(21, -20, 3, 13);
  if(wheels) wagonWheel(12, 0, roll, 9.5, false);
  else { wagonWheel(14, 0, 0.4, 9.5, false); g.fillStyle = '#3a2410'; g.save(); g.translate(-16, -1); g.rotate(1.2); g.fillRect(-9, -1, 18, 2); g.restore(); }
}
function wagonWheel(x, y, roll, r, far){
  const g = ctx;
  g.strokeStyle = far ? '#2a1a0a' : '#3e2812'; g.lineWidth = 2.4;
  g.beginPath(); g.arc(x, y - r, r, 0, TAU); g.stroke();
  g.lineWidth = 1.2; g.beginPath();
  for(let k = 0; k < 6; k++){ const a = roll * 2 + k * Math.PI / 3; g.moveTo(x, y - r); g.lineTo(x + Math.cos(a) * (r - 1), y - r + Math.sin(a) * (r - 1)); }
  g.stroke();
  g.fillStyle = '#8a6a3a'; g.beginPath(); g.arc(x, y - r, 2.2, 0, TAU); g.fill();
}
// -- HUD --
const HUD_GOLD = '#d6b46a', HUD_INK = 'rgba(14,11,9,0.74)', PARCH = '#efe4c8';
// Towns along the route, as a fraction of the march to Moscow
const PLACES = [[0, 'Kovno'], [0.07, 'Vilna'], [0.24, 'Vitebsk'], [0.42, 'Smolensk'], [0.62, 'Vyazma'], [0.8, 'Borodino'], [0.95, 'Moscow']];
function placeName(){
  const p = napoleon.x / MOSCOW_X;
  let name = PLACES[0][1];
  for(const [t, n] of PLACES) if(p >= t - 0.03) name = n;
  return name;
}
// Napoleon's strength along the road, sampled for the campaign map (after Minard, 1869)
let campaignLog = { adv: [], ret: [] };
function logCampaign(){
  if(phase !== 'playing' && phase !== 'retreat' && phase !== 'burned' && phase !== 'gameover_win') return;
  const n = napoleon.soldiers.filter(s => s.alive && !s.dying).length;
  const log = napoleon.retreating ? campaignLog.ret : campaignLog.adv;
  const last = log[log.length - 1];
  if(!last || Math.abs(napoleon.x - last.x) >= 60) log.push({ x: napoleon.x, n, t: Math.round(temperature) });
  else { last.n = Math.min(last.n, n); }
}

function hudPanel(x, y, w, h, accent){
  const ac = accent || HUD_GOLD;
  ctx.fillStyle = HUD_INK;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 5); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,236,190,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = css(ac, 0.75); ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 5); ctx.stroke();
  ctx.strokeStyle = css(ac, 0.22); ctx.beginPath(); ctx.roundRect(x + 3.5, y + 3.5, w - 7, h - 7, 3); ctx.stroke();
  ctx.fillStyle = css(ac, 0.9);
  for(const [cx, cy] of [[x + 3.5, y + 3.5], [x + w - 3.5, y + 3.5], [x + 3.5, y + h - 3.5], [x + w - 3.5, y + h - 3.5]]){
    ctx.beginPath(); ctx.moveTo(cx, cy - 2.6); ctx.lineTo(cx + 2.6, cy); ctx.lineTo(cx, cy + 2.6); ctx.lineTo(cx - 2.6, cy); ctx.fill();
  }
}
function hudText(text, x, y, font, color, align){
  ctx.font = font; ctx.textAlign = align || 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function hudButton(r, label, enabled, tone, font){
  const hot = enabled && !isMobile && mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h;
  const base = enabled ? mix(tone, '#ffffff', hot ? 0.12 : 0) : col('#25211d');
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  g.addColorStop(0, css(mix(base, '#ffffff', 0.14))); g.addColorStop(1, css(shade(base, 0.7)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 4); ctx.fill();
  ctx.strokeStyle = enabled ? css(HUD_GOLD, hot ? 0.95 : 0.6) : 'rgba(90,80,70,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 4); ctx.stroke();
  ctx.textBaseline = 'middle';
  hudText(label, r.x + r.w / 2, r.y + r.h / 2 + 1, font || 'bold 12px Cinzel, serif', enabled ? PARCH : '#6a625a', 'center');
  ctx.textBaseline = 'alphabetic';
}
function tempColor(){
  return temperature > 5 ? '#c4e48c' : temperature > -5 ? '#f0d860' : temperature > -15 ? '#9ad0ff' : '#b8c0ff';
}

function drawHUD(){
  // Russian forces (top left)
  const aliveR = russia.deployed.filter(s => s.alive && !s.dying).length;
  hudPanel(8, 8, 196, 52, '#8fc89a');
  hudText('RUSSIAN ARMY', 20, 28, 'bold 12px Cinzel, serif', '#a4e2ae');
  hudText(`Deployed ${aliveR}`, 20, 48, '13px "IM Fell English", serif', PARCH);
  hudText(`Reserve ${russia.bank}`, 192, 48, '13px "IM Fell English", serif', PARCH, 'right');

  // Grande Armée and its provisions (top centre)
  const aliveF = napoleon.soldiers.filter(s => s.alive && !s.dying).length;
  const px = W / 2 - 160;
  hudPanel(px, 8, 320, 52, '#9fb4f0');
  hudText('GRANDE ARMÉE', px + 12, 27, 'bold 12px Cinzel, serif', '#bccbff');
  hudText(`${aliveF} / 100`, px + 308, 28, 'bold 15px Cinzel, serif', aliveF > 40 ? PARCH : '#ff9a80', 'right');
  const foodPct = Math.max(0, napoleon.food / napoleon.maxFood);
  const bx = px + 12, by = 35, bw = 296, bh = 13;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
  const hl = hungerLevel(), low = hl >= 2, pulse = low ? 0.75 + 0.25 * Math.sin(gameTime * 0.008) : 1;
  const fg = ctx.createLinearGradient(0, by, 0, by + bh);
  fg.addColorStop(0, ['#ecca62', '#e8a848', '#f07050', '#f05040'][hl]); fg.addColorStop(1, ['#a8801e', '#9a6418', '#8a2418', '#6a140c'][hl]);
  ctx.globalAlpha = pulse; ctx.fillStyle = fg;
  if(foodPct > 0){ ctx.beginPath(); ctx.roundRect(bx + 1, by + 1, Math.max(3, (bw - 2) * foodPct), bh - 2, 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; for(let k = 1; k < 10; k++) ctx.fillRect(bx + bw * k / 10, by + 2, 1, bh - 4);
  ctx.strokeStyle = 'rgba(214,180,106,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(bx + 0.5, by + 0.5, bw - 1, bh - 1, 3); ctx.stroke();
  hudText(`Provisions ${Math.floor(napoleon.food)} · ${HUNGER[hl]}`, W / 2, by + 10, 'bold 9px Cinzel, serif', hl >= 2 ? '#ffd8c8' : '#fff8e8', 'center');
  for(const ind of foodIndicators){
    ctx.globalAlpha = Math.min(1, ind.life / 280);

    ctx.fillStyle = 'rgba(14,11,9,0.8)'; ctx.beginPath(); ctx.arc(JCX, JCY, JR, 0, TAU); ctx.fill();
    ctx.strokeStyle = HUD_GOLD; ctx.lineWidth = 2; ctx.stroke();

    const kg = ctx.createRadialGradient(kx - 5, ky - 5, 2, kx, ky, 18);

// Campaign strip after Minard: tan band = the advance, black = the retreat, width = men remaining
function drawProgressBar(){
  const w = 384, h = 40, x = W / 2 - w / 2, y = H - 48;
  hudPanel(x, y, w, h);
  const ix = x + 6, iy = y + 6, iw = w - 12, ih = h - 12;
  ctx.fillStyle = 'rgba(232,220,192,0.92)'; ctx.fillRect(ix, iy, iw, ih);
  const lx = ix + 10, rx = ix + iw - 10, mid = iy + 11;
  const X = wx => lx + clamp01(wx / MOSCOW_X) * (rx - lx);
  // Visible stretch of road
  ctx.fillStyle = 'rgba(90,70,40,0.12)'; ctx.fillRect(X(camera.x), iy, Math.max(2, X(camera.x + W) - X(camera.x)), ih);
  ctx.fillStyle = 'rgba(60,44,28,0.35)'; ctx.fillRect(lx, mid, rx - lx, 1);
  const band = (log, off, fill, edge) => {
    if(log.length < 2) return;
    ctx.beginPath();
    log.forEach((p, i) => { const yy = mid + off - 0.5 - p.n * 0.045; i ? ctx.lineTo(X(p.x), yy) : ctx.moveTo(X(p.x), yy); });
    for(let i = log.length - 1; i >= 0; i--) ctx.lineTo(X(log[i].x), mid + off + 0.5 + log[i].n * 0.045);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if(edge){ ctx.strokeStyle = edge; ctx.lineWidth = 0.6; ctx.stroke(); }
  };
  band(campaignLog.adv, -1, '#d8b878', 'rgba(120,90,50,0.8)');
  band(campaignLog.ret, 2, '#1a1612', null);
  // Rivers; a red cross where the bridge is down
  for(let i = 0; i < rivers.length; i++){
    const rxp = X(rivers[i].x);
    ctx.fillStyle = 'rgba(60,100,150,0.75)'; ctx.fillRect(rxp - 0.6, iy + 2, 1.2, 17);
    if(!bridges[i].intact){
      ctx.strokeStyle = '#c0281c'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(rxp - 3, mid - 3); ctx.lineTo(rxp + 3, mid + 3); ctx.moveTo(rxp + 3, mid - 3); ctx.lineTo(rxp - 3, mid + 3); ctx.stroke();
    }
  }
  // Farms along the road: gold = food to forage, hollow = stripped (regrowing), dark cross = burned
  for(const f of farms){
    const fx2 = X(f.x), fy2 = mid + 6.5;
    if(f.burnt || f.burning){ ctx.strokeStyle = 'rgba(40,24,14,0.85)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(fx2 - 1.6, fy2 - 1.6); ctx.lineTo(fx2 + 1.6, fy2 + 1.6); ctx.moveTo(fx2 + 1.6, fy2 - 1.6); ctx.lineTo(fx2 - 1.6, fy2 + 1.6); ctx.stroke(); }
    else if(f.alive && f.food > 4){ ctx.fillStyle = '#c8961e'; ctx.beginPath(); ctx.arc(fx2, fy2, 0.9 + 1.5 * f.food / f.maxFood, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(150,110,40,0.7)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(fx2, fy2, 1.3, 0, TAU); ctx.stroke(); }
  }
  // Moscow, then the Emperor's position
  ctx.fillStyle = moscow.burned ? '#d04a1c' : '#8a2a1a'; ctx.beginPath(); ctx.arc(rx, mid, 3, 0, TAU); ctx.fill();
  const nx = X(napoleon.x);
  ctx.fillStyle = '#1a2a6a'; ctx.beginPath(); ctx.moveTo(nx - 4, mid - 7); ctx.lineTo(nx + 4, mid - 7); ctx.lineTo(nx, mid - 2); ctx.fill();
  if(russia.inBattle && russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx]){
    ctx.fillStyle = '#2a7a3a'; ctx.beginPath(); ctx.arc(X(russia.deployed[russia.controlledIdx].x), mid + 6, 2.2, 0, TAU); ctx.fill();
  }
  ctx.font = 'italic 9px "IM Fell English", serif'; ctx.fillStyle = 'rgba(50,36,22,0.9)';
  ctx.textAlign = 'left'; ctx.fillText('Niemen', ix + 3, iy + ih - 2);
  ctx.textAlign = 'center';
  for(const [t, n] of PLACES) if(t > 0.2 && t < 0.9) ctx.fillText(n, X(t * MOSCOW_X), iy + ih - 2);
  ctx.textAlign = 'right'; ctx.fillText('Moscow', ix + iw - 3, iy + ih - 2);
}

function drawBridgeBuildIndicator(){
  if(!napoleon.buildingBridge) return;
  const b = bridges.find(b => !b.intact && Math.abs(b.x - napoleon.x) < 110);
  const sx = (b ? b.x : napoleon.x) - camera.x, y = ROAD_TOP - 54;
  const pct = clamp01(napoleon.bridgeBuildTime / napoleon.bridgeBuildMax);
  const days = Math.max(0, daysLost - (napoleon.bridgeDaysStart || 0));
  ctx.fillStyle = 'rgba(14,11,9,0.8)'; ctx.beginPath(); ctx.roundRect(sx - 86, y - 20, 172, 42, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,154,122,0.75)'; ctx.lineWidth = 1; ctx.stroke();

// Napoleon held up at a broken bridge somewhere off-screen: say where, and what it costs him
function drawOffscreenHalt(){
  if(!napoleon.buildingBridge) return;
  const bi = bridges.findIndex(b => !b.intact && Math.abs(b.x - napoleon.x) < 110);
  const bx = (bi >= 0 ? bridges[bi].x : napoleon.x) - camera.x;
  if(bx > 60 && bx < W - 60) return;
  const left = bx < 0, days = Math.floor(Math.max(0, daysLost - (napoleon.bridgeDaysStart || 0)));
  const text = `${left ? '◀  ' : ''}Napoleon halted at the ${bi >= 0 ? RIVER_NAMES[bi] : 'river'} · +${days} days${left ? '' : '  ▶'}`;
  ctx.font = 'bold 11px Cinzel, serif';
  const tw = ctx.measureText(text).width + 24, y = 300, x = left ? 10 : W - 10 - tw;
  const pulse = 0.7 + 0.3 * Math.sin(gameTime * 0.006);
  ctx.fillStyle = 'rgba(14,11,9,0.82)'; ctx.beginPath(); ctx.roundRect(x, y - 15, tw, 25, 5); ctx.fill();
  ctx.strokeStyle = `rgba(255,154,122,${pulse})`; ctx.lineWidth = 1.2; ctx.stroke();
  hudText(text, x + 12, y + 2, 'bold 11px Cinzel, serif', '#ffb898');
}

// -- VICTORY / DEFEAT SCREENS --
// The player's own campaign drawn after Minard's 1869 map: tan = the advance, black = the retreat,
// band width = men remaining; temperature of the retreat charted beneath.
function drawMinardChart(x, y, w, h){
  ctx.fillStyle = '#e9dcc0'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(80,60,36,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
  const lx = x + 30, rx = x + w - 30;
  const X = wx => lx + clamp01(wx / MOSCOW_X) * (rx - lx);
  const advY = y + h * 0.3, retY = y + h * 0.47, k = h / 420;
  ctx.font = 'italic 10px "IM Fell English", serif'; ctx.textAlign = 'center';
  for(let i = 0; i < rivers.length; i++){
    const rxp = X(rivers[i].x);
    ctx.strokeStyle = 'rgba(70,110,160,0.45)'; ctx.beginPath(); ctx.moveTo(rxp, y + 18); ctx.quadraticCurveTo(rxp + 6, y + h * 0.4, rxp - 2, y + h * 0.6); ctx.stroke();
    ctx.fillStyle = 'rgba(60,80,110,0.8)'; ctx.fillText(RIVER_NAMES[i], rxp, y + h * 0.6 + 10);
  }
  const band = (log, cy, fill, edge) => {
    if(log.length < 2) return;
    ctx.beginPath();
    log.forEach((p, i) => { const yy = cy - p.n * k / 2; i ? ctx.lineTo(X(p.x), yy) : ctx.moveTo(X(p.x), yy); });
    for(let i = log.length - 1; i >= 0; i--) ctx.lineTo(X(log[i].x), cy + log[i].n * k / 2);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if(edge){ ctx.strokeStyle = edge; ctx.lineWidth = 0.8; ctx.stroke(); }
  };
  band(campaignLog.adv, advY, '#d9b679', 'rgba(110,80,40,0.9)');
  band(campaignLog.ret, retY, '#18140f', null);
  ctx.fillStyle = 'rgba(40,28,16,0.9)'; ctx.font = '11px "IM Fell English", serif';
  for(const [t, n] of PLACES) if(t > 0.05) ctx.fillText(n, X(t * MOSCOW_X), y + 15);
  ctx.textAlign = 'left'; ctx.fillText('Niemen', x + 8, y + 15);
  const adv = campaignLog.adv, ret = campaignLog.ret;
  ctx.font = 'bold 11px Cinzel, serif';
  if(adv.length){ ctx.fillStyle = '#7a5428'; ctx.fillText(`${adv[0].n}`, lx - 22, advY + 4); ctx.textAlign = 'right'; ctx.fillText(`${adv[adv.length - 1].n}`, rx + 24, advY + 4); }
  if(ret.length){ ctx.fillStyle = '#18140f'; ctx.textAlign = 'center'; const last = ret[ret.length - 1]; ctx.fillText(`${last.n}`, X(last.x), retY + last.n * k / 2 + 13); }
  // Temperature of the retreat
  const ty0 = y + h * 0.7, ty1 = y + h - 10, T = tc => ty0 + clamp01(-tc / 35) * (ty1 - ty0);
  ctx.strokeStyle = 'rgba(80,60,36,0.25)'; ctx.lineWidth = 0.6; ctx.textAlign = 'left'; ctx.font = '9px "IM Fell English", serif'; ctx.fillStyle = 'rgba(60,44,28,0.75)';
  for(const tc of [0, -15, -30]){ ctx.beginPath(); ctx.moveTo(lx, T(tc)); ctx.lineTo(rx, T(tc)); ctx.stroke(); ctx.fillText(`${tc}°`, rx + 4, T(tc) + 3); }
  if(ret.length > 1){
    ctx.strokeStyle = '#18140f'; ctx.lineWidth = 1.2; ctx.beginPath();
    ret.forEach((p, i) => i ? ctx.lineTo(X(p.x), T(p.t)) : ctx.moveTo(X(p.x), T(p.t))); ctx.stroke();
    ctx.setLineDash([2, 3]); ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(24,20,15,0.45)';
    for(let i = 0; i < ret.length; i += Math.max(1, Math.floor(ret.length / 6))){ const p = ret[i]; ctx.beginPath(); ctx.moveTo(X(p.x), retY + p.n * k / 2); ctx.lineTo(X(p.x), T(p.t)); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  ctx.fillStyle = 'rgba(60,44,28,0.7)'; ctx.font = 'italic 9px "IM Fell English", serif'; ctx.textAlign = 'right';
  ctx.fillText('after C. J. Minard, 1869 — your campaign', x + w - 8, y + h - 3);
}

// How Napoleon's soldiers died, by cause
function deathTally(){
  const t = { combat: 0, disease: 0, starve: 0, freeze: 0 };
  for(const s of napoleon.soldiers){
    if(s.alive) continue;
    const k = s.frozenBody || s.deathType === 'freeze' ? 'freeze' : s.deathType;
    if(t[k] !== undefined) t[k]++;
  }
  return t;
}
const DEATH_KEYS = [['combat', 'Battle', '#c0442e'], ['disease', 'Typhus', '#7a9a44'], ['starve', 'Hunger', '#b08a4e'], ['freeze', 'Cold', '#8ab4e0']];
// Ending tier by the men who make it home
function endingFor(n){
  if(n <= 0) return { title: 'The Grande Armée Is Destroyed', color: '#e2be6a', line: 'Not one of Napoleon\'s 100,000 men makes it back across the Niemen.' };
  if(n <= 7) return { title: 'Russia Endures', color: '#e2be6a', line: `Only ${n} of 100,000 soldiers stumble back across the Niemen.` };
  if(n <= 19) return { title: 'A Costly Victory', color: '#d8b070', line: `${n} of his 100,000 escape across the Niemen — enough to rebuild an army.` };
  return { title: 'Napoleon Escapes', color: '#c8a8a0', line: `${n} of his 100,000 march home across the Niemen. He will be back.` };
}
// What the player did, and what it did to the Grande Armée
function campaignLessons(n, tally){
  const burnt = farms.filter(f => f.burnt).length, total = farms.length;
  const ruLost = russia.deployed.filter(s => !s.alive).length;
  const lines = [];
  lines.push(burnt / total < 0.35
    ? 'The farms you spared fed his march — and fed him again on the way home.'
    : `You burned ${burnt} of ${total} farms: hunger, and the typhus it bred, did the killing.`);
  lines.push(daysLost < 6
    ? 'His bridges stood, so he marched fast and outran the worst of the winter.'
    : `Broken bridges cost him ${Math.round(daysLost)} days — winter caught his army on the open road.`);
  if(tally.combat > (tally.disease + tally.starve + tally.freeze) * 0.4)
    lines.push(`Battle killed ${tally.combat} of his men — and ${ruLost} of yours. Russia could not afford to fight that way.`);
  else lines.push(n <= 7
    ? 'It was not your army that defeated Napoleon. It was the land itself.'
    : 'Russia\'s real weapons were hunger, distance and winter — use them all.');
  return lines;
}

// -- VISUAL EFFECTS --
// Purely cosmetic particles. World particles use world x; `screen` ones are in screen space.
let fx = [];
let shakeAmt = 0;
const FX_MAX = 900;
function addFx(p){ if(fx.length < FX_MAX){ p.max = p.life; fx.push(p); } }
function addShake(a){ shakeAmt = Math.min(10, Math.max(shakeAmt, a)); }
const rand = (a, b) => a + Math.random() * (b - a);

function fxHit(target, dir){
  const x = target.x, y = target.y - 26;
  for(let i = 0; i < 6; i++) addFx({ type:'spark', x, y: y + rand(-6, 6), vx: dir * rand(40, 160) + rand(-40, 40), vy: rand(-110, 20), life: rand(160, 320) });
  addFx({ type:'dust', x: x - dir * 4, y: target.y, vx: dir * 20, vy: -6, r: 5, grow: 18, life: 500, c:'#9a8a70' });
}
// Musket discharge: flash at the muzzle and a lingering bank of powder smoke
function fxShot(shooter, dir){

  addFx({ type:'flash', x, y, life: 90 });
  for(let i = 0; i < 3; i++) addFx({ type:'smoke', x: x + dir * i * 5, y: y + rand(-3, 3), vx: dir * rand(14, 30), vy: rand(-8, -2), r: 4 + i * 2, grow: 16, life: rand(1200, 1900), c:'#e6e2da', a: 0.5 });
}
// A word floating up from the battlefield (food hauled, nothing found, days lost)
function fxText(x, y, text, color){ addFx({ type:'text', x, y, vy: -18, text, c: color, life: 1700 }); }
// Grain flying from a farm into a forager's arms
function fxGrain(farm, s){

}
function fxIgnite(x, y){

  for(let i = 0; i < 14; i++) addFx({ type:'ember', x: x + rand(-20, 20), y: y - rand(10, 40), vx: rand(-50, 50), vy: rand(-140, -50), life: rand(700, 1600) });
  addFx({ type:'smoke', x, y: y - 30, vx: 0, vy: -20, r: 16, grow: 40, life: 1600, c:'#3a3028', a: 0.6 });
}
function fxBridgeBreak(x){

  const y = ROAD_MID;

  for(let i = 0; i < 6; i++) addFx({ type:'smoke', x: x + rand(-30, 30), y, vx: rand(-10, 10), vy: -15, r: 10, grow: 30, life: 1400, c:'#8a8070', a: 0.45 });
}
function fxCityBurst(){
