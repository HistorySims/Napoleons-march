<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>1812 — The Retreat Will Teach Them</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden;font-family:'IM Fell English',serif}
#wrap{position:relative;width:1000px;max-width:100vw;aspect-ratio:1000/560;flex-shrink:0}
canvas{display:block;width:100%;height:100%;cursor:default}

/* Mobile deploy panel — sits below the canvas in the dead space */
#mobile-deploy{
  display:none;
  width:100vw;
  background:linear-gradient(#1b1611,#0d0a08);
  border-top:1px solid rgba(214,180,106,0.75);
  box-shadow:inset 0 1px 0 rgba(214,180,106,0.18);
  padding:10px 16px 14px;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
}
#md-header{
  display:flex;justify-content:space-between;align-items:center;
  color:#a4e2ae;font-family:Cinzel,serif;font-size:12px;letter-spacing:.4px;
}
#md-header strong{color:#d6b46a}
.md-hint{color:rgba(239,228,200,0.55);font-family:'IM Fell English',serif;font-style:italic;font-size:12px;letter-spacing:0}
#md-controls{display:flex;align-items:center;gap:8px}
.md-btn{
  background:linear-gradient(#3c4a36,#1c2418);border:1px solid rgba(214,180,106,0.6);color:#efe4c8;
  font-family:Cinzel,serif;font-size:16px;font-weight:bold;
  width:38px;height:38px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.md-btn:active{background:linear-gradient(#4c5c46,#2a3426)}
.md-btn:disabled{background:#1e1a16;border-color:#3a342c;color:#5a524a}
#md-count{
  background:rgba(0,0,0,0.55);border:1px solid rgba(214,180,106,0.4);color:#fff8e8;
  font-family:Cinzel,serif;font-size:16px;font-weight:bold;
  width:52px;height:38px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  letter-spacing:1px;
}
#md-send{
  flex:1;height:38px;background:linear-gradient(#3c6a3c,#1e3a1e);border:1px solid rgba(214,180,106,0.7);
  color:#efe4c8;font-family:Cinzel,serif;font-size:13px;font-weight:bold;
  border-radius:6px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#md-send:active{background:linear-gradient(#4c7c4c,#2a4a2a)}
#md-send:disabled{background:#1e1a16;border-color:#3a342c;color:#5a524a}
#md-in-battle{
  display:none;align-items:center;gap:10px;
  color:#a4e2ae;font-family:Cinzel,serif;font-size:13px;
}
#md-in-battle-label{flex:1}

@media(max-width:768px){
  #wrap{width:100vw;max-width:none;aspect-ratio:1000/560;height:auto}
  body{justify-content:flex-start;align-items:stretch}
  #mobile-deploy{display:flex}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="mobile-deploy">
  <!-- Shown when NOT inBattle -->
  <div id="md-idle">
    <div id="md-header">
      <span>Russian Reserve: <strong id="md-bank">50</strong></span>
      <span class="md-hint">Add soldiers, then deploy</span>
    </div>
    <div id="md-controls">
      <button class="md-btn" id="md-minus">−</button>
      <div id="md-count">0</div>
      <button class="md-btn" id="md-plus">+</button>
      <button id="md-send">&#x2694; Send into Battle</button>
    </div>
  </div>
  <!-- Shown when inBattle -->
  <div id="md-in-battle">
    <span id="md-in-battle-label">&#x2694; In Battle — WASD + Space to fight</span>
  </div>
</div>
<script>
'use strict';

const W=1000, H=560;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
// Render at device resolution (capped) so sprites and text stay crisp on HiDPI screens
const DPR = Math.min(('ontouchstart' in window) ? 1.5 : 2, window.devicePixelRatio || 1);
canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);

// -- GAME CONSTANTS --
const MAP_WIDTH = 12000;
const MOSCOW_X = MAP_WIDTH - 400;
const GROUND_Y = 340;
const LANE_TOP = 258, LANE_BOT = 495;
const DEPLOY_ZONE_X = 150;

// -- GAME STATE --
let phase = 'title'; // title | playing | burned | napoleon_wins | retreat | gameover_win | gameover_lose
let camera = { x: 0 };
let temperature = 15; // Celsius, drops as Napoleon approaches Moscow and during retreat
let gameTime = 0;
let retreatTime = 0;

// Napoleon's army
let napoleon = {
x: 200, y: GROUND_Y + 40,
soldiers: [],
food: 800,
maxFood: 800,
speed: 38,
alive: true,
retreating: false,
stopped: false,
stopTimer: 0,
atMoscow: false,
buildingBridge: false,
bridgeBuildTime: 0,
bridgeBuildMax: 3000,
wagons: [],         // supply wagons following the army
workerIds: [],      // ids of soldiers assigned as bridge workers
buildBridgeX: 0,    // x of bridge being built
};

// Russian forces
let russia = {
bank: 50,
deployed: [],
controlledIdx: -1,
totalDeployed: 0,
pendingSoldiers: 0,
inBattle: false,
sharedFarmTarget: null,
sharedBridgeTarget: null,
};

// Moscow city state
let moscow = { hp: 300, maxHp: 300, burned: false };

// -- CAMPAIGN: supplies, calendar and winter --
// The Grande Armée carried only part of what it needed and lived off Russian farms.
const START_FOOD = 400;              // stores carried across the Niemen (of 800)
const FOOD_PER_SOLDIER = 0.00005;    // food eaten per soldier per ms, marching or waiting
const REGROW_MS = 60000;             // a looted farm's harvest comes back; a burned one never does
const BRIDGE_DAYS_PER_SEC = 0.8;     // calendar days lost per second spent rebuilding a bridge
const RETREAT_DAYS_PER_SEC = 0.17;   // pace of the calendar on the road home
const RETREAT_SPEED = 36;
const MOSCOW_DAY = 82, RETREAT_DAY = 117; // reach Moscow 14 Sept; leave 19 Oct after five weeks waiting
const COLD_K = 0.0001;               // chance per second of freezing, per degree below -4°C
let daysLost = 0;                    // days the Russians cost him at broken bridges
let hints = new Set();               // one-time dispatches already shown

// Days since 24 June 1812
function campaignDay(){
  if(napoleon.retreating) return RETREAT_DAY + daysLost + retreatTime / 1000 * RETREAT_DAYS_PER_SEC;
  return Math.min(1, napoleon.x / MOSCOW_X) * MOSCOW_DAY + daysLost;
}
const TEMP_BY_DAY = [[0,17],[40,21],[82,10],[117,2],[135,-8],[150,-15],[160,-22],[168,-30],[180,-35]];
function tempForDay(d){
  const k = TEMP_BY_DAY;
  if(d <= k[0][0]) return k[0][1];
  for(let i = 1; i < k.length; i++) if(d <= k[i][0]) return k[i-1][1] + (k[i][1] - k[i-1][1]) * (d - k[i-1][0]) / (k[i][0] - k[i-1][0]);
  return k[k.length - 1][1];
}
const MONTHS = [['June',30,1812],['July',31,1812],['August',31,1812],['September',30,1812],['October',31,1812],['November',30,1812],['December',31,1812],['January',31,1813],['February',28,1813]];
function dateLabel(d){
  let day = 24 + Math.floor(d), m = 0;
  while(m < MONTHS.length - 1 && day > MONTHS[m][1]){ day -= MONTHS[m][1]; m++; }
  return `${day} ${MONTHS[m][0]} ${MONTHS[m][2]}`;
}
// 0 when the retreat begins in October, 1 by mid-December (drives snow and the winter look)
function winterProgress(){ return napoleon.retreating ? Math.max(0, Math.min(1, (campaignDay() - RETREAT_DAY) / 55)) : 0; }
const HUNGER = ['Well fed', 'Rationed', 'Hungry', 'Starving'];
function hungerLevel(){ const r = napoleon.food / napoleon.maxFood; return napoleon.food <= 0 ? 3 : r < 0.2 ? 2 : r < 0.45 ? 1 : 0; }
function farmBurnable(f){ return !f.burnt && !f.burning; }
// Explain the why the first time something happens
function hint(key, text, ms){ if(hints.has(key)) return; hints.add(key); addMessage(text, ms || 4500); }

// Map features
let farms = [];
let bridges = [];
let rivers = [];
let mapFeatures = [];

// Player input
let keys = {};
let mouse = { x:0, y:0, down:false };
let dragFromBank = false;
const isMobile = 'ontouchstart' in window;
const touch = { jx:0, jy:0, jActive:false, jSX:0, jSY:0, attack:false, atkId:-1, jId:-1 };
const JR=48, JCX=75, JCY=H-85, ACX=W-75, ACY=H-85, AR=46;

// -- MOBILE DEPLOY PANEL --
const mdBank    = document.getElementById('md-bank');
const mdCount   = document.getElementById('md-count');
const mdMinus   = document.getElementById('md-minus');
const mdPlus    = document.getElementById('md-plus');
const mdSend    = document.getElementById('md-send');
const mdIdle    = document.getElementById('md-idle');
const mdBattle  = document.getElementById('md-in-battle');

function syncMobilePanel(){
  if(!isMobile) return;
  if(mdBank)  mdBank.textContent  = russia.bank;
  if(mdCount) mdCount.textContent = russia.pendingSoldiers;
  if(mdMinus) mdMinus.disabled = russia.pendingSoldiers <= 0;
  if(mdPlus)  mdPlus.disabled  = russia.bank <= 0;
  if(mdSend)  mdSend.disabled  = russia.pendingSoldiers <= 0;
  const inBattle = russia.inBattle;
  if(mdIdle)   mdIdle.style.display   = inBattle ? 'none'  : 'block';
  if(mdBattle) mdBattle.style.display = inBattle ? 'flex'  : 'none';
}

if(mdMinus) mdMinus.addEventListener('click', () => {
  if(russia.pendingSoldiers > 0){ russia.pendingSoldiers--; russia.bank++; syncMobilePanel(); }
});
if(mdPlus) mdPlus.addEventListener('click', () => {
  if(russia.bank > 0){ russia.pendingSoldiers++; russia.bank--; syncMobilePanel(); }
});
if(mdSend) mdSend.addEventListener('click', () => {
  if(russia.pendingSoldiers > 0 && (phase==='playing'||phase==='retreat')){ sendIntoBattle(); syncMobilePanel(); }
});

// Effects
let effects = [];
let messages = [];
let ghosts = [];
let snowflakes = [];
let foodIndicators = []; // {text, color, life, maxLife, floatY}

// -- INPUT --
window.addEventListener('keydown', e => { keys[e.code]=true; });
window.addEventListener('keyup', e => { keys[e.code]=false; });

function toCanvas(cx,cy){
const r=canvas.getBoundingClientRect();
return [(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)];
}

canvas.addEventListener('mousedown', e => {
const [mx,my]=toCanvas(e.clientX,e.clientY);
mouse.x=mx; mouse.y=my; mouse.down=true;
handleMouseDown(mx,my);
});
canvas.addEventListener('mousemove', e => {
const [mx,my]=toCanvas(e.clientX,e.clientY);
mouse.x=mx; mouse.y=my;
});
canvas.addEventListener('mouseup', e => {
const [mx,my]=toCanvas(e.clientX,e.clientY);
mouse.down=false;
handleMouseUp(mx,my);
});
canvas.addEventListener('click', e => {
const [mx,my]=toCanvas(e.clientX,e.clientY);
handleClick(mx,my);
});

// Touch support  - multi-touch for joystick, attack, and deploy drag
canvas.addEventListener('touchstart', e => {
e.preventDefault();
for(const t of e.changedTouches){
const [tx,ty]=toCanvas(t.clientX,t.clientY);

// Title / end screen taps
if(phase==='title'||phase==='burned'||phase==='napoleon_wins'||phase==='gameover_win'||phase==='gameover_lose'
  ||(phase==='playing'&&napoleon.atMoscow)){
  handleClick(tx,ty);
  continue;
}

// Attack button area (right side, bottom)
if(tx > W-140 && ty > H-150){
  touch.attack=true; touch.atkId=t.identifier;
  continue;
}
// Joystick area (left side, bottom)  - only when inBattle
if(russia.inBattle && tx < 160 && ty > H-160){
  touch.jActive=true; touch.jId=t.identifier;
  touch.jSX=tx; touch.jSY=ty; touch.jx=0; touch.jy=0;
  continue;
}
// Deploy box button taps
handleClick(tx,ty);

}
},{passive:false});

canvas.addEventListener('touchmove', e => {
e.preventDefault();
for(const t of e.changedTouches){
const [tx,ty]=toCanvas(t.clientX,t.clientY);
if(t.identifier===touch.jId && touch.jActive){
let dx=tx-touch.jSX, dy=ty-touch.jSY;
const len=Math.sqrt(dx*dx+dy*dy);
if(len>JR){dx*=JR/len;dy*=JR/len;}
touch.jx=dx/JR; touch.jy=dy/JR;
}
}
},{passive:false});

canvas.addEventListener('touchend', e => {
e.preventDefault();
for(const t of e.changedTouches){
if(t.identifier===touch.jId){
touch.jActive=false; touch.jx=0; touch.jy=0; touch.jId=-1;
}
if(t.identifier===touch.atkId){
touch.attack=false; touch.atkId=-1;
}
}
},{passive:false});

// -- MAP GENERATION --
function buildMap(){
farms=[]; bridges=[]; rivers=[];

// Rivers with bridges
const riverPositions = [1800, 3600, 5400, 7200, 9000, 10500];
for(const rx of riverPositions){
rivers.push({ x:rx, width:80 });
bridges.push({ x:rx, intact:true, hp:100, maxHp:100, width:80 });
}

// Farm types: farmhouse, barn, windmill, cottage
const FARM_TYPES = ['farmhouse','barn','windmill','cottage'];
// Farms on both sides of the road
for(let i=0; i<26; i++){
  const fx = 500 + i * 420 + (Math.random()-0.5)*140;
  if(rivers.some(r => Math.abs(r.x - fx)<120)) continue;
  // Alternate above / below road, with some randomness
  const aboveRoad = (i % 2 === 0) || Math.random() < 0.3;
  const fy = aboveRoad
    ? GROUND_Y + 14 + Math.floor(Math.random()*8)    // north strip: just above the road (y 354-362)
    : GROUND_Y + 140 + Math.floor(Math.random()*14); // south strip: lower field near bottom (y 480-494)
  farms.push({
    x: fx, y: fy,
    food: 28 + Math.floor(Math.random()*22),
    maxFood: 50,
    alive: true,
    burning: false,
    burnTimer: 0,
    farmHp: 3,
    isHouse: false,
    type: FARM_TYPES[i % 4],
  });
}
// Village houses densely clustered near Moscow (x 8000-11200), both sides
for(let i=0; i<14; i++){
  const fx = 8000 + i * 240 + (Math.random()-0.5)*100;
  if(rivers.some(r => Math.abs(r.x - fx)<120)) continue;
  const aboveRoad = i % 2 === 0;
  const fy = aboveRoad
    ? GROUND_Y + 14 + Math.floor(Math.random()*8)    // north strip above road
    : GROUND_Y + 140 + Math.floor(Math.random()*12); // south strip near bottom
  farms.push({
    x: fx, y: fy,
    food: 18 + Math.floor(Math.random()*14),
    maxFood: 32,
    alive: true,
    burning: false,
    burnTimer: 0,
    farmHp: 3,
    isHouse: true,
    type: 'farmhouse',
  });
}
}

// -- ENTITY CREATION --
function createFrenchSoldier(x, y, role){
return {
x, y: y || GROUND_Y + 20 + Math.random()*60,
hp: 100, maxHp: 100,
alive: true,
dying: false, dyingMs: 0,
deathType: null,
speed: napoleon.speed + (Math.random()-0.5)*8,
walkTimer: Math.random()*1000,
facing: 1,
frozen: 0,
frozenBody: false,
exclamTimer: 0,
diseased: false,
sickness: 0,        // 0-1 green disease progression
flash: 0,
knockVX: 0,         // knockback velocity x
knockTimer: 0,
offsetY: (Math.random()-0.5)*40,
role: role || 'column', // 'vanguard','column','raider','worker'
raidTarget: null,
raidReturning: false,
carrying: false,    // raider carrying food
carryFood: 0,
hammerAngle: 0,     // bridge worker hammer animation
atkCd: Math.random()*700,  // stagger initial attacks so soldiers don't all fire at once
atkCdMax: 700,
id: Math.random(),
};
}

function createRussianSoldier(x, y){
return {
x, y: y || GROUND_Y + 30 + Math.random()*50,
hp: 100, maxHp: 100,
alive: true,
dying: false, dyingMs: 0,
speed: 55,
walkTimer: Math.random()*1000,
facing: -1,
atkCd: 0, atkCdMax: 700,
atkTimer: 0,
atkRange: 36,
flash: 0,
knockVX: 0,
knockTimer: 0,
controlled: false,
id: Math.random(),
};
}

function initNapoleonArmy(){
napoleon.soldiers = [];
// Vanguard: advance scouts spread ahead of Napoleon
for(let i=0; i<12; i++){
const x = 260 + Math.random()*100;
const s = createFrenchSoldier(x, undefined, 'vanguard');
s.offsetY = (Math.random()-0.5)*50;
napoleon.soldiers.push(s);
}
// Main column: stretched behind Napoleon
for(let i=0; i<78; i++){
const x = 80 + Math.random()*180;
const s = createFrenchSoldier(x, undefined, 'column');
napoleon.soldiers.push(s);
}
// Raiders: small parties of 2-3 that visibly detach to forage farms
for(let i=0; i<3; i++){
const x = 120 + Math.random()*150;
const s = createFrenchSoldier(x, undefined, 'raider');
napoleon.soldiers.push(s);
}
napoleon.food = START_FOOD;
napoleon.x = 200;
napoleon.retreating = false;
napoleon.atMoscow = false;
napoleon.stopped = false;
napoleon.buildingBridge = false;
napoleon.bridgeBuildTime = 0;
napoleon.workerIds = [];
napoleon.buildBridgeX = 0;
// Supply wagons: 3 carts following the column
napoleon.wagons = [
{x: napoleon.x - 120, y: GROUND_Y + 42, wobble: 0, offsetZ: -8},
{x: napoleon.x - 200, y: GROUND_Y + 38, wobble: Math.PI, offsetZ: 6},
{x: napoleon.x - 290, y: GROUND_Y + 44, wobble: Math.PI*0.7, offsetZ: -4},
];
}

// -- HANDLE INPUT --
function handleMouseDown(mx, my){
// no drag-to-deploy; clicks handled by handleClick
}

function handleMouseUp(mx, my){
}

function handleClick(mx, my){
if(phase==='title'){
// Check start button
if(mx > W/2-120 && mx < W/2+120 && my > H/2+80 && my < H/2+130){
startGame();
}
return;
}
if(phase==='burned'){
// Continue to retreat phase
phase = 'retreat';
napoleon.retreating = true;
napoleon.speed = RETREAT_SPEED;
retreatTime = 0;
for(const s of napoleon.soldiers) s.facing = -1;
addMessage('He must retreat down the road he came, with winter coming.', 4500);
addMessage('Farms you spared will feed him. Broken bridges will hold him in the cold.', 5500);
return;
}
if(phase==='napoleon_wins' || phase==='gameover_win' || phase==='gameover_lose'){
if(my > H/2+60 && my < H/2+110){
resetGame();
}
return;
}
// Burn Moscow choice
if(phase==='playing' && napoleon.atMoscow){
// Buttons drawn in HUD
const btnY = H/2 + 36;
if(my > btnY && my < btnY+50){
if(mx > W/2-220 && mx < W/2-20){
// BURN IT
burnMoscow();
} else if(mx > W/2+20 && mx < W/2+220){
// SURRENDER
phase = 'napoleon_wins';
}
}
return;
}

// Deploy box buttons (desktop only — mobile uses HTML panel)
if(!isMobile && (phase==='playing' || phase==='retreat') && !russia.inBattle){
// Minus
if(mx >= BTN_MINUS.x && mx <= BTN_MINUS.x+BTN_MINUS.w && my >= BTN_MINUS.y && my <= BTN_MINUS.y+BTN_MINUS.h){
if(russia.pendingSoldiers > 0){ russia.pendingSoldiers--; russia.bank++; }
return;
}
// Plus
if(mx >= BTN_PLUS.x && mx <= BTN_PLUS.x+BTN_PLUS.w && my >= BTN_PLUS.y && my <= BTN_PLUS.y+BTN_PLUS.h){
if(russia.bank > 0){ russia.pendingSoldiers++; russia.bank--; }
return;
}
// Send into battle
if(mx >= BTN_SEND.x && mx <= BTN_SEND.x+BTN_SEND.w && my >= BTN_SEND.y && my <= BTN_SEND.y+BTN_SEND.h){
if(russia.pendingSoldiers > 0){
sendIntoBattle();
}
return;
}
}

// Click on deployed Russian soldier to switch control (only when inBattle)
if(russia.inBattle && (phase==='playing' || phase==='retreat')){
for(let i=0; i<russia.deployed.length; i++){
const s = russia.deployed[i];
if(!s.alive) continue;
const sx = s.x - camera.x;
if(Math.abs(mx-sx)<20 && my > s.y-56 && my < s.y+8){
if(russia.controlledIdx>=0 && russia.deployed[russia.controlledIdx])
russia.deployed[russia.controlledIdx].controlled = false;
s.controlled = true;
russia.controlledIdx = i;
break;
}
}
}
}

function burnMoscow(){
phase = 'burned';
moscow.burned = true;
fxCityBurst();
// Napoleon gets NO food from Moscow — immediately begin retreat
napoleon.retreating = true;
napoleon.speed = RETREAT_SPEED;
napoleon.stopped = false;
retreatTime = 0;
// Flip all French soldiers to face west (left)
for(const s of napoleon.soldiers){
  if(s.alive && !s.dying) s.facing = -1;
}
addMessage('Moscow burns! Napoleon has nothing. He must retreat into winter.', 5000);
}

function sendIntoBattle(){
if(russia.pendingSoldiers <= 0) return;
// Deselect previous controlled
if(russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx])
russia.deployed[russia.controlledIdx].controlled = false;
russia.controlledIdx = -1;

// Spawn soldiers ahead of the Grande Armée: the east edge on the advance, the west edge in the retreat
const ahead = napoleon.retreating ? -1 : 1;
const spawnBaseX = ahead > 0 ? camera.x + W - 80 : camera.x + 80;
for(let i=0; i<russia.pendingSoldiers; i++){
const sy = LANE_TOP + 20 + Math.random() * (LANE_BOT - LANE_TOP - 40);
const sx = spawnBaseX - ahead * i * 18 + (Math.random()-0.5)*10;
const s = createRussianSoldier(Math.max(camera.x+20, Math.min(camera.x + W - 20, sx)), sy);
s.facing = -ahead;
if(i === 0){
s.controlled = true;
russia.controlledIdx = russia.deployed.length;
}
russia.deployed.push(s);
russia.totalDeployed++;
}
const count = russia.pendingSoldiers;
russia.pendingSoldiers = 0;
russia.inBattle = true;
addMessage(`${count} soldier${count>1?'s':''} deployed! WASD to move, Space to attack.`, 2500);
hint('deploy', 'Get ahead of his column: burn the farms, break the bridges.', 4000);
}

function updateBurned(dt){
retreatTime += dt;
temperature = tempForDay(campaignDay());
spawnAndUpdateSnow(dt);

// Napoleon himself walks west
napoleon.x -= napoleon.speed * (dt/1000);

// Russian forces keep fighting
updateRussianForces(dt);
updateCombat(dt);
updateDying(dt);
updateFarmsAndBridges(dt);

// Camera follows player or Napoleon
let focusX = napoleon.x - 350;
if(russia.inBattle && russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx]?.alive){
  focusX = russia.deployed[russia.controlledIdx].x - 500;
}
camera.x += (focusX - camera.x) * Math.min(1, dt/300);
camera.x = Math.max(0, Math.min(MAP_WIDTH - W, camera.x));

// Transition to full retreat once Napoleon moves a bit west
if(napoleon.x < MOSCOW_X - 200){
  phase = 'retreat';
}
}

function startGame(){
phase = 'playing';
buildMap();
initNapoleonArmy();
russia.bank = 50;
russia.deployed = [];
russia.controlledIdx = -1;
russia.totalDeployed = 0;
russia.pendingSoldiers = 0;
russia.inBattle = false;
russia.sharedFarmTarget = null;
russia.sharedBridgeTarget = null;
russia.bridgesCut = 0;
moscow.hp = moscow.maxHp;
moscow.burned = false;
temperature = 15;
gameTime = 0;
retreatTime = 0;
camera.x = 0;
effects = [];
messages = [];
ghosts = [];
snowflakes = [];
foodIndicators = [];
fx = [];
shakeAmt = 0;
campaignLog = { adv: [], ret: [] };
daysLost = 0;
hints = new Set();
napoleon._lastFood = START_FOOD;
temperature = tempForDay(0);
addMessage('June 1812: Napoleon crosses into Russia with 100,000 men.', 4000);
addMessage('He carries little food. His army must live off Russian farms.', 5000);
addMessage('Use + to add soldiers, then Send into Battle to deploy them.', 6000);
}

function resetGame(){
phase = 'title';
}

// -- MESSAGES --
function addMessage(text, duration){
messages.push({ text, life: duration, maxLife: duration });
// Keep dispatches readable: once three are showing, older ones give way quickly
for(let i = 0; i < messages.length - 3; i++) messages[i].life = Math.min(messages[i].life, 400);
}

// -- UPDATE --
function update(dt){
gameTime += dt;

// Update messages
for(let i=messages.length-1; i>=0; i--){
messages[i].life -= dt;
if(messages[i].life <= 0) messages.splice(i,1);
}


updateFx(dt);
if(phase==='playing') updatePlaying(dt);
else if(phase==='retreat') updateRetreat(dt);
else if(phase==='burned') updateBurned(dt);
logCampaign();

// Update ghosts (rising wisps of the dead)
for(let i=ghosts.length-1; i>=0; i--){
  const g = ghosts[i];
  g.y -= g.vy * (dt/1000);
  g.life -= dt;
  if(g.life <= 0) ghosts.splice(i,1);
}

// Food gain indicator — detect when food increases during playing/retreat
if(phase==='playing' || phase==='retreat'){
  const foodDelta = napoleon.food - (napoleon._lastFood || napoleon.food);
  if(foodDelta > 2){
    foodIndicators.push({text: foodDelta >= 8 ? `+${Math.round(foodDelta)}` : '+', color:'#44ee66', life:1100, maxLife:1100, floatY:0});
  }
}
napoleon._lastFood = napoleon.food;

// Tick food indicators
for(let i=foodIndicators.length-1; i>=0; i--){
  const ind = foodIndicators[i];
  ind.life -= dt;
  ind.floatY = (1 - ind.life / ind.maxLife) * 20;
  if(ind.life <= 0) foodIndicators.splice(i, 1);
}

syncMobilePanel();
}

function updatePlaying(dt){
// The calendar runs with the march; days lost at rivers push it toward winter
temperature = tempForDay(campaignDay());

updateNapoleonAdvance(dt);
updateRussianForces(dt);
updateCombat(dt);
updateFarmsAndBridges(dt);

// Camera: follow player only when inBattle and controlled alive
let focusX = napoleon.x - 350;
if(russia.inBattle && russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx]?.alive){
const cs = russia.deployed[russia.controlledIdx];
focusX = cs.x - 500;
}
camera.x += (focusX - camera.x) * Math.min(1, dt/300);
camera.x = Math.max(0, Math.min(MAP_WIDTH - W, camera.x));

// Check: Napoleon reaches Moscow
if(napoleon.x >= MOSCOW_X && !napoleon.atMoscow){
napoleon.atMoscow = true;
napoleon.stopped = true;
const alive = napoleon.soldiers.filter(s=>s.alive&&!s.dying).length;
addMessage(`Napoleon reaches Moscow with ${alive} soldiers!`, 5000);
}
}

function updateRetreat(dt){
retreatTime += dt;
temperature = tempForDay(campaignDay());
spawnAndUpdateSnow(dt);

// Napoleon marches back (leftward)
if(!napoleon.stopped){
napoleon.x = Math.max(0, napoleon.x - napoleon.speed * (dt/1000));
// French soldiers follow
for(const s of napoleon.soldiers){
if(!s.alive || s.dying) continue;
const targetX = napoleon.x + (s.x - napoleon.x) * 0.3 + (Math.random()-0.5)*2;
s.x += (targetX - s.x) * 0.01 - napoleon.speed * (dt/1000) * 0.9;
s.walkTimer += dt;
}

// Check rivers  - need bridges
for(const bridge of bridges){
  if(!bridge.intact && Math.abs(napoleon.x - bridge.x) < 60){
    napoleon.stopped = true;
    napoleon.buildingBridge = true;
    napoleon.bridgeBuildTime = 0;
    napoleon.bridgeBuildMax = 4000;
    napoleon.bridgeDaysStart = daysLost;
    addMessage('Bridge out! His army waits in the snow while it is rebuilt — attack now!', 3500);
    break;
  }
}

} else if(napoleon.buildingBridge) {
napoleon.bridgeBuildTime += dt;
daysLost += dt / 1000 * BRIDGE_DAYS_PER_SEC;
if(napoleon.bridgeBuildTime >= napoleon.bridgeBuildMax){
napoleon.buildingBridge = false;
napoleon.stopped = false;
// Find the bridge and "rebuild" it
for(const b of bridges){
if(!b.intact && Math.abs(napoleon.x - b.x)<100){
b.intact = true; b.hp = 50; break;
}
}
addMessage(`Bridge rebuilt — ${Math.round(daysLost - napoleon.bridgeDaysStart)} more days lost to winter.`, 3000);
}
}

forageAlongRoad(dt);
updateRetreatAttrition(dt);
updateRussianForces(dt);
updateCombat(dt);
updateDying(dt);
updateFarmsAndBridges(dt);

// Camera
let focusX = napoleon.x - 350;
if(russia.inBattle && russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx]?.alive){
focusX = russia.deployed[russia.controlledIdx].x - 500;
}
camera.x += (focusX - camera.x) * Math.min(1, dt/300);
camera.x = Math.max(0, Math.min(MAP_WIDTH - W, camera.x));

// Win condition: Napoleon's army destroyed or he retreats past start
const aliveF = napoleon.soldiers.filter(s=>s.alive&&!s.dying).length;
if(aliveF <= 0){
phase = 'gameover_win';
addMessage('The Grande Armée is destroyed!', 5000);
}
if(napoleon.x < 100){
phase = 'gameover_win';
addMessage(`Napoleon escapes with ${aliveF} soldiers of 100,000.`, 5000);
}
}

// On the way home the column strips whatever farms are still standing
function forageAlongRoad(dt){
for(const farm of farms){
  if(!farm.alive || farm.food <= 0 || Math.abs(farm.x - napoleon.x) > 420) continue;
  for(const s of napoleon.soldiers){
    if(!s.alive || s.dying) continue;
    if(Math.abs(s.x - farm.x) < 50 && Math.abs(s.y - farm.y) < 70){
      const take = Math.min(dt * 0.004, farm.food);
      farm.food -= take;
      napoleon.food = Math.min(napoleon.maxFood, napoleon.food + take);
      if(Math.random() < dt * 0.004) fxGrain(farm, s);
      if(farm.food <= 0){ farm.alive = false; fxText(farm.x, farm.y - 64, 'stripped', '#e8c060'); }
      hint('spared', 'A farm you spared is feeding his retreat.', 4000);
    }
  }
}
}

// Winter: hungry men sicken, starve and freeze, marching or waiting at a river
function updateRetreatAttrition(dt){
const alive = napoleon.soldiers.filter(s => s.alive && !s.dying);
napoleon.food = Math.max(0, napoleon.food - dt * FOOD_PER_SOLDIER * alive.length);
const hunger = hungerLevel();
const hungerMult = [1, 1.25, 1.7, 2.3][hunger];
const starveFactor = Math.max(0, 1 - (napoleon.food / napoleon.maxFood) * 2);
const freezeChance = Math.max(0, -temperature - 4) * COLD_K * hungerMult * dt / 1000;
const infectChance = (0.0004 + 0.003 * starveFactor) * dt / 1000;
const starveChance = hunger === 3 ? 0.003 * dt / 1000 : 0;
if(hunger >= 2) hint('hungry', 'His army is going hungry. Hunger breeds typhus, and hungry men freeze first.', 5000);
for(const s of alive){
  if(s.diseased){
    s.sickness = Math.min(1, s.sickness + dt * 0.00012);
    if(s.sickness >= 1){ s.dying = true; s.dyingMs = 2000; s.deathType = 'disease'; continue; }
  } else if(Math.random() < infectChance){ s.diseased = true; s.sickness = 0.05; }
  if(Math.random() < freezeChance){
    s.dying = true; s.dyingMs = 1500; s.deathType = 'freeze'; s.frozen = 1;
    hint('freeze', 'Winter has come. Men are freezing on the road.', 3500);
  } else if(Math.random() < starveChance){
    s.dying = true; s.dyingMs = 1500; s.deathType = 'starve';
    hint('starve', 'Men are starving in the ranks.', 3000);
  }
}
}
function updateNapoleonAdvance(dt){
// Bridge building runs regardless of stopped state
if(napoleon.buildingBridge){
napoleon.bridgeBuildTime += dt;
// Workers animate hammering and move toward bridge
for(const s of napoleon.soldiers){
  if(!s.alive || s.dying || s.role !== 'worker') continue;
  const workerSlot = napoleon.workerIds.indexOf(s.id);
  const targetX = napoleon.buildBridgeX + (workerSlot - 1.5) * 14;
  const dx = targetX - s.x;
  if(Math.abs(dx) > 6){
    s.x += Math.sign(dx) * 40 * (dt/1000);
    s.facing = dx > 0 ? 1 : -1;
    s.walkTimer += dt;
  }
  if(Math.abs(dx) < 30){
    s.hammerAngle = Math.sin(gameTime * 0.008 + workerSlot) * 1.4;
  }
}
daysLost += dt / 1000 * BRIDGE_DAYS_PER_SEC;
updateArmyUpkeep(dt);
if(napoleon.bridgeBuildTime >= napoleon.bridgeBuildMax){
  napoleon.buildingBridge = false;
  napoleon.stopped = false;
  for(const b of bridges){
    if(!b.intact && Math.abs(napoleon.x - b.x) < 100){
      b.intact = true; b.hp = 100; break;
    }
  }
  for(const s of napoleon.soldiers){
    if(s.role === 'worker'){ s.role = 'column'; s.hammerAngle = 0; }
  }
  napoleon.workerIds = [];
  addMessage(`Bridge rebuilt. ${Math.round(daysLost - napoleon.bridgeDaysStart)} days lost — and his men ate while they waited.`, 3500);
}
return; // don't march while workers are building
}

if(napoleon.stopped || napoleon.atMoscow) return;

// Check for river/bridge — assign workers when first hit
for(const bridge of bridges){
if(Math.abs(napoleon.x - bridge.x) < 50){
if(!bridge.intact){
  napoleon.stopped = true;
  napoleon.buildingBridge = true;
  napoleon.bridgeBuildTime = 0;
  napoleon.bridgeBuildMax = 5000;
  napoleon.buildBridgeX = bridge.x;
  napoleon.bridgeDaysStart = daysLost;
  napoleon.workerIds = [];
  for(const s of napoleon.soldiers){
    if(s.alive && !s.dying && s.role === 'column' && napoleon.workerIds.length < 4){
      s.role = 'worker';
      napoleon.workerIds.push(s.id);
    }
  }
  addMessage('Bridge out! The Grande Armée halts to rebuild — attack the workers!', 3500);
  return;
}
}
}

// March forward
napoleon.x += napoleon.speed * (dt/1000);

// Update supply wagons — follow column at fixed offsets
for(let i = 0; i < napoleon.wagons.length; i++){
const wag = napoleon.wagons[i];
const targetX = napoleon.x - 140 - i * 90;
wag.x += (targetX - wag.x) * 0.03 + napoleon.speed * (dt/1000) * 0.82;
wag.wobble += dt * 0.003;
}

// Soldiers move according to role
for(const s of napoleon.soldiers){
if(!s.alive || s.dying) continue;
s.walkTimer += dt;

if(s.role === 'vanguard'){
  // Vanguard runs well ahead — but STOPS at broken bridges
  let blockX = Infinity;
  for(const b of bridges){
    if(!b.intact && b.x > napoleon.x && b.x < blockX) blockX = b.x;
  }
  const rawTargetX = napoleon.x + 60 + s.offsetY * 0.3;
  const targetX = Math.min(rawTargetX, blockX - 32);
  // Approach target gradually; slow to a stop at bridge edge without hard-snapping
  s.x += (targetX - s.x) * 0.012 + Math.min(napoleon.speed * (dt/1000) * 0.95, Math.max(0, blockX - 32 - s.x));
  s.facing = 1;
} else if(s.role === 'raider'){
  // Decay exclamation timer
  if(s.exclamTimer > 0) s.exclamTimer = Math.max(0, s.exclamTimer - dt);

  // Raiders race ahead to loot farms, then carry food back slowly (laden)
  let nearFarm = null, nearFarmDist = Infinity;
  for(const farm of farms){
    if(!farm.alive || farm.food <= 0 || farm.burning || farm.farmHp <= 0) continue;
    const d = Math.hypot(s.x - farm.x, s.y - farm.y);
    if(d < 700 && farm.x > napoleon.x - 100 && d < nearFarmDist){
      nearFarm = farm; nearFarmDist = d;
    }
  }
  if(nearFarm && !s.raidReturning){
    s.raidTarget = nearFarm;
    s.burntTarget = null;
    const dx = nearFarm.x - s.x;
    const dy = nearFarm.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    if(dist > 22){
      s.x += (dx/dist) * s.speed * 1.55 * (dt/1000);
      s.y += (dy/dist) * s.speed * 1.55 * (dt/1000);
      s.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, s.y));
      s.facing = dx > 0 ? 1 : -1;
    } else {
      // At farm — forage, load cart
      const take = Math.min(dt * 0.015, nearFarm.food);
      nearFarm.food -= take;
      s.carryFood = Math.min(20, s.carryFood + take);
      if(Math.random() < dt * 0.01) fxGrain(nearFarm, s);
      if(nearFarm.food <= 0 || s.carryFood >= 18){
        nearFarm.alive = nearFarm.food > 0;
        s.raidReturning = true;
        s.raidTarget = null;
        s.carrying = s.carryFood > 0;
      }
    }
  } else if(!s.raidReturning && !s.burntTarget){
    // No live farm — look for a burnt farm to investigate (within 600px ahead)
    let nearBurnt = null, nearBurntDist = Infinity;
    for(const farm of farms){
      if(farm.alive) continue; // skip live farms
      const d = Math.hypot(s.x - farm.x, s.y - farm.y);
      if(d < 600 && farm.x > napoleon.x - 50 && d < nearBurntDist){
        nearBurnt = farm; nearBurntDist = d;
      }
    }
    if(nearBurnt){
      s.burntTarget = nearBurnt;
    } else {
      // Nothing to investigate — just follow army
      const targetX = napoleon.x - 40;
      const targetY = GROUND_Y + 35;
      s.x += (targetX - s.x) * 0.008 + napoleon.speed * (dt/1000) * 0.88;
      s.y += (targetY - s.y) * 0.025;
      s.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, s.y));
      s.facing = 1;
    }
  } else if(s.burntTarget && !s.raidReturning){
    // Move toward burnt farm
    const dx = s.burntTarget.x - s.x;
    const dy = s.burntTarget.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    if(dist > 26){
      s.x += (dx/dist) * s.speed * 1.3 * (dt/1000);
      s.y += (dy/dist) * s.speed * 1.3 * (dt/1000);
      s.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, s.y));
      s.facing = dx > 0 ? 1 : -1;
    } else {
      // Arrived at burnt farm — show red ! and turn back
      s.exclamTimer = 1800;
      s.burntTarget = null;
      s.raidReturning = true;
      foodIndicators.push({text:'−', color:'#ee3333', life:1100, maxLife:1100, floatY:0});
      fxText(s.x, s.y - 72, 'nothing left!', '#ff6a50');
      hint('empty', 'His foragers come back empty-handed — there is nothing left to take.', 4000);
    }
  } else {
    // Return to army with food — laden, so noticeably slower
    const targetX = napoleon.x - 60;
    const targetY = GROUND_Y + 35;
    s.x += (targetX - s.x) * 0.008 + napoleon.speed * (dt/1000) * 0.62;
    s.y += (targetY - s.y) * 0.025;
    s.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, s.y));
    s.facing = s.x > napoleon.x ? -1 : 1;
    if(Math.abs(s.x - napoleon.x) < 180){
      if(s.carrying){
        napoleon.food = Math.min(napoleon.maxFood, napoleon.food + s.carryFood);
        fxText(s.x, s.y - 66, `+${Math.round(s.carryFood)} food`, '#f2d266');
        hint('forage', 'His foragers bring back Russian grain. Burn the farms before they reach them!', 5000);
        s.carryFood = 0;
        s.carrying = false;
      }
      s.raidReturning = false;
    }
  }
} else if(s.role === 'column'){
  // Main column — spread 50-550 behind Napoleon
  const colPos = (napoleon.soldiers.indexOf(s) % 78) / 78;
  const targetX = napoleon.x - 50 - colPos * 500 + s.offsetY * 0.2;
  s.x += (targetX - s.x) * 0.006 + napoleon.speed * (dt/1000) * 0.88;
  s.facing = 1;
  // Forage only from road-level farms (can't reach upper/lower fields)
  for(const farm of farms){
    if(farm.alive && Math.abs(s.x - farm.x) < 50 && Math.abs(s.y - farm.y) < 70 && farm.food > 0){
      const take = Math.min(dt * 0.004, farm.food);
      farm.food -= take;
      napoleon.food = Math.min(napoleon.maxFood, napoleon.food + take);
      if(Math.random() < dt * 0.004) fxGrain(farm, s);
      if(farm.food <= 0){ farm.alive = false; fxText(farm.x, farm.y - 64, 'stripped', '#e8c060'); }
    }
  }
}
}

updateArmyUpkeep(dt);
updateDying(dt);
}

// Every soldier eats, and sickness runs its course, whether the army marches or waits at a river.
// Disease spreads from 25% of the march onward (historically >50% died before Moscow); hunger multiplies it.
function updateArmyUpkeep(dt){
let n = 0;
for(const s of napoleon.soldiers) if(s.alive && !s.dying) n++;
napoleon.food = Math.max(0, napoleon.food - dt * FOOD_PER_SOLDIER * n);
const marchProgress = napoleon.x / MOSCOW_X;
const starveFactor = Math.max(0, 1 - (napoleon.food / napoleon.maxFood) * 2);   // 0 at 50%+ food, 1 at empty
const distFactor = marchProgress > 0.25 ? Math.min(1, (marchProgress - 0.25) / 0.75) : 0;
// Typhus and dysentery follow the march; hunger adds its own toll on top
const infChance = (distFactor * 0.35 * 0.000024 + starveFactor * 0.0000025) * dt;
const starveChance = napoleon.food <= 0 ? 0.000002 * dt : 0;
if(hungerLevel() >= 2) hint('hungry', 'The Grande Armée is going hungry — and hunger breeds typhus.', 5000);
for(const s of napoleon.soldiers){
  if(!s.alive || s.dying) continue;
  if(s.diseased){
    // ~11s of visibly sickening before death
    s.sickness = Math.min(1, s.sickness + dt * 0.00009);
    if(s.sickness >= 1){ s.dying = true; s.dyingMs = 2000; s.deathType = 'disease'; continue; }
  } else if(Math.random() < infChance){ s.diseased = true; s.sickness = 0.05; }
  if(Math.random() < starveChance){
    s.dying = true; s.dyingMs = 1500; s.deathType = 'starve';
    hint('starve', 'Men are starving in the ranks.', 3000);
  }
}
}

function updateDying(dt){
for(const s of napoleon.soldiers){
if(s.dying){
s.dyingMs -= dt;
if(s.dyingMs <= 0){
  if(s.deathType === 'freeze'){
    // Persist as blue frozen corpse on the ground
    s.frozenBody = true;
  } else if(s.deathType === 'disease' || s.deathType === 'starve'){
    // Spawn rising ghost
    ghosts.push({ x: s.x, y: s.y, vy: 55, life: 2200, maxLife: 2200, kind: s.deathType });
  }
  s.alive = false; s.dying = false;
}
}
if(s.flash > 0) s.flash -= dt;
if(s.knockTimer > 0){ s.x += s.knockVX*(dt/1000); s.knockTimer=Math.max(0,s.knockTimer-dt); if(s.knockTimer<=0)s.knockVX=0; }
}
for(const s of russia.deployed){
if(s.dying){
s.dyingMs -= dt;
if(s.dyingMs <= 0){ s.alive = false; s.dying = false; }
}
if(s.flash > 0) s.flash -= dt;
if(s.knockTimer > 0){ s.x += s.knockVX*(dt/1000); s.knockTimer=Math.max(0,s.knockTimer-dt); if(s.knockTimer<=0)s.knockVX=0; }
}
}

function updateRussianForces(dt){
// If inBattle and controlled soldier died, find next alive or end battle
if(russia.inBattle){
const cur = russia.controlledIdx >= 0 ? russia.deployed[russia.controlledIdx] : null;
if(!cur || (!cur.alive && !cur.dying)){
// Try to hand control to another alive deployed soldier
let newCtrl = -1;
for(let i=0; i<russia.deployed.length; i++){
if(russia.deployed[i].alive && !russia.deployed[i].dying){ newCtrl=i; break; }
}
if(newCtrl >= 0){
if(russia.controlledIdx >= 0 && russia.deployed[russia.controlledIdx])
russia.deployed[russia.controlledIdx].controlled = false;
russia.deployed[newCtrl].controlled = true;
russia.controlledIdx = newCtrl;
} else {
russia.inBattle = false;
russia.controlledIdx = -1;
addMessage('Your soldiers are gone. Reinforce from the reserve.', 3000);
}
}
}
const controlled = russia.controlledIdx >= 0 ? russia.deployed[russia.controlledIdx] : null;

// Player-controlled soldier
if(controlled && controlled.alive && !controlled.dying){
let dx=0, dy=0;
if(keys['ArrowLeft']||keys['KeyA']) dx=-1;
if(keys['ArrowRight']||keys['KeyD']) dx=1;
if(keys['ArrowUp']||keys['KeyW']) dy=-1;
if(keys['ArrowDown']||keys['KeyS']) dy=1;
if(Math.abs(touch.jx)>0.1) dx=touch.jx;
if(Math.abs(touch.jy)>0.1) dy=touch.jy;
const len=Math.hypot(dx,dy);
if(len>0){ dx/=len; dy/=len; }
controlled.x += dx * controlled.speed * (dt/1000);
controlled.y += dy * controlled.speed * 0.6 * (dt/1000);
controlled.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, controlled.y));
controlled.x = Math.max(20, Math.min(MAP_WIDTH-20, controlled.x));
if(dx!==0) controlled.facing = dx>0?1:-1;
controlled.walkTimer += dt * (Math.abs(dx)+Math.abs(dy) > 0 ? 1 : 0);

// Attack
controlled.atkCd = Math.max(0, controlled.atkCd - dt);
if(controlled.atkTimer > 0) controlled.atkTimer = Math.max(0, controlled.atkTimer - dt);
if((keys['Space']||keys['KeyZ']||touch.attack) && controlled.atkCd <= 0){
  controlled.atkCd = controlled.atkCdMax;
  controlled.atkTimer = 250;
  // Hit French soldiers — 3 hits to kill (34 dmg per hit on 100 HP)
  for(const f of napoleon.soldiers){
    if(!f.alive || f.dying) continue;
    const ddx = (f.x - controlled.x) * controlled.facing;
    const ddy = Math.abs(f.y - controlled.y);
    if(ddx > -10 && ddx < controlled.atkRange && ddy < 30){
      f.hp -= 34 + Math.floor(Math.random()*4);
      f.flash = 200;
      fxHit(f, controlled.facing); addShake(1.2);
      if(Math.random() < 0.35) fxShot(controlled, controlled.facing);
      // Knockback: push enemy in the direction the player is facing
      f.knockVX = controlled.facing * 80;
      f.knockTimer = 180;
      if(f.hp <= 0 && !f.dying){
        f.dying = true; f.dyingMs = 800; f.deathType = 'combat';
      }
      break; // one hit per swing
    }
  }
  // Attack bridges — wide hitbox covering full lane width at bridge
  for(const b of bridges){
    if(b.intact && Math.abs(controlled.x - b.x) < 70 && Math.abs(controlled.y - (GROUND_Y + 80)) < 80){
      b.hp -= 15;
      russia.sharedBridgeTarget = b;
      fxHit({ x: controlled.x + controlled.facing * 14, y: ROAD_BOT }, controlled.facing);
      addMessage(`Bridge damaged! (${Math.max(0,b.hp)}/${b.maxHp})`, 1000);
      if(b.hp <= 0){
        b.intact = false;
        russia.bridgesCut = (russia.bridgesCut || 0) + 1;
        fxBridgeBreak(b.x);
        if(russia.sharedBridgeTarget === b) russia.sharedBridgeTarget = null;

        hint('bridge', 'Bridge destroyed! Every day he spends rebuilding it brings winter closer.', 5000);
      }
      break;
    }
  }
  // Attack farms / houses — 3 hits to destroy
  for(const farm of farms){
    if(!farmBurnable(farm)) continue;
    if(Math.abs(controlled.x - farm.x) < 55 && Math.abs(controlled.y - farm.y) < 58){
      farm.farmHp = Math.max(0, farm.farmHp - 1);
      fxHit({ x: farm.x - controlled.facing * 10, y: farm.y }, controlled.facing);
      if(farm.farmHp <= 0){
        farm.burning = true;
        fxIgnite(farm.x, farm.y);
        farm.burnTimer = 2500;
        russia.sharedFarmTarget = farm;
        if(hints.has('burn')) addMessage(farm.isHouse ? 'House burning!' : 'Farm burning! Scorched earth!', 2000);
        hint('burn', 'Burned! His foragers will find nothing here — not now, and not on his way home.', 5000);
      } else {
        const label = farm.type === 'windmill' ? 'Windmill' : farm.isHouse ? 'House' : farm.type === 'barn' ? 'Barn' : farm.type === 'cottage' ? 'Cottage' : 'Farm';
        addMessage(`${label} hit! ${farm.farmHp} hit${farm.farmHp>1?'s':''} to burn.`, 900);
      }
      break; // one farm per swing
    }
  }
  // Attack Moscow directly
  if(!moscow.burned && Math.abs(controlled.x - MOSCOW_X) < 130){
    moscow.hp = Math.max(0, moscow.hp - (18 + Math.floor(Math.random()*10)));
    fxHit({ x: controlled.x + controlled.facing * 20, y: GROUND_Y + 4 }, controlled.facing); addShake(1.5);
    if(moscow.hp <= 0 && !napoleon.atMoscow){
      napoleon.atMoscow = true;
      napoleon.stopped = true;
      addMessage('Moscow is crumbling! Confirm the burning of the city!', 4000);
    }
  }
}

}

// AI soldiers: follow player first; join combat only when player is fighting
let playerNearFrench = false;
if(controlled && controlled.alive && !controlled.dying){
  for(const f of napoleon.soldiers){
    if(!f.alive||f.dying) continue;
    if(Math.hypot(f.x-controlled.x, f.y-controlled.y) < 180){ playerNearFrench = true; break; }
  }
}

for(let i=0; i<russia.deployed.length; i++){
const s = russia.deployed[i];
if(!s.alive || s.dying || s.controlled) continue;
s.atkCd = Math.max(0, s.atkCd - dt);
if(s.atkTimer > 0) s.atkTimer = Math.max(0, s.atkTimer - dt);

// Find nearest French
let nearF = null, nearD = Infinity;
for(const f of napoleon.soldiers){
  if(!f.alive||f.dying) continue;
  const d = Math.hypot(f.x-s.x, f.y-s.y);
  if(d < nearD){ nearF=f; nearD=d; }
}

// Engage French only if: player is fighting (join the fight) OR enemy is right on top of us
const engageRange = playerNearFrench ? 180 : 50; // self-defence only when player is focused elsewhere
if(nearF && nearD < engageRange){
  // Attack
  const ddx = nearF.x - s.x, ddy = nearF.y - s.y;
  const dlen = Math.hypot(ddx,ddy)||1;
  s.facing = ddx > 0 ? 1 : -1;
  if(nearD > s.atkRange){
    s.x += (ddx/dlen) * s.speed * (dt/1000);
    s.y += (ddy/dlen) * s.speed * 0.4 * (dt/1000);
  } else if(s.atkCd <= 0){
    s.atkCd = s.atkCdMax; s.atkTimer = 250;
    nearF.hp -= 34 + Math.floor(Math.random()*4);
    nearF.flash = 200;
    fxHit(nearF, s.facing);
    if(Math.random() < 0.3) fxShot(s, s.facing);
    nearF.knockVX = (s.facing) * 70;
    nearF.knockTimer = 160;
    if(nearF.hp <= 0 && !nearF.dying){
      nearF.dying = true; nearF.dyingMs = 800; nearF.deathType = 'combat';
    }
  }
} else if(controlled && controlled.alive && !controlled.dying){
  // Follow controlled soldier — shared farm target, then follow player
  if(russia.sharedFarmTarget && russia.sharedFarmTarget.alive && !russia.sharedFarmTarget.burning){
    const ft = russia.sharedFarmTarget;
    const fdx = ft.x - s.x, fdy = ft.y - s.y;
    const fd = Math.hypot(fdx, fdy) || 1;
    if(fd > 40){
      s.x += (fdx/fd) * s.speed * 1.1 * (dt/1000);
      s.y += (fdy/fd) * s.speed * 0.55 * (dt/1000);
      s.facing = fdx > 0 ? 1 : -1;
    }
  } else {
    const ddx = controlled.x - s.x, ddy = controlled.y - s.y;
    const d = Math.hypot(ddx,ddy)||1;
    if(d > 50){
      s.x += (ddx/d) * s.speed * 1.0 * (dt/1000);
      s.y += (ddy/d) * s.speed * 0.5 * (dt/1000);
      s.facing = ddx > 0 ? 1 : -1;
    }
  }
}
s.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, s.y));
s.walkTimer += dt;

}

updateDying(dt);
}

function updateCombat(dt){
// French soldiers fight back against nearby Russians — same stats as Russian soldiers
for(const f of napoleon.soldiers){
if(!f.alive||f.dying) continue;
f.walkTimer += dt;
f.atkCd = Math.max(0, f.atkCd - dt);

let nearR = null, nearD = Infinity;
for(const r of russia.deployed){
  if(!r.alive||r.dying) continue;
  const d = Math.hypot(r.x-f.x, r.y-f.y);
  if(d < nearD){ nearR=r; nearD=d; }
}

if(napoleon.retreating){
  // During retreat: walk west unless a Russian engages within 100px
  if(nearR && nearD < 100){
    // Turn to fight
    f.facing = nearR.x > f.x ? 1 : -1;
    if(nearD < 36 && f.atkCd <= 0){
      f.atkCd = f.atkCdMax;
      f.lungeAt = gameTime;
      nearR.hp -= 34 + Math.floor(Math.random()*4);
      nearR.flash = 200;
      fxHit(nearR, nearR.x > f.x ? 1 : -1);
      if(Math.random() < 0.3) fxShot(f, nearR.x > f.x ? 1 : -1);
      nearR.knockVX = (nearR.x > f.x ? 1 : -1) * 80;
      nearR.knockTimer = 180;
      if(nearR.hp <= 0 && !nearR.dying){ nearR.dying = true; nearR.dyingMs = 800; }
    }
  } else {
    // March west
    f.facing = -1;
    f.x -= napoleon.speed * 0.75 * (dt/1000);
    // Cluster loosely around Napoleon
    const targetX = napoleon.x + (f.offsetY !== undefined ? f.offsetY * 0.15 : 0) + (Math.random()-0.5)*40;
    f.x += (targetX - f.x) * 0.003;
  }
} else {
  // The column closes ranks: line infantry near an attacker turn and engage him together.
  // (Why Russia avoided pitched battle — foragers and bridge-builders, alone, are another matter.)
  if(nearR && nearD < 110 && (f.role === 'column' || f.role === 'vanguard')){
    if(f.homeY === undefined) f.homeY = f.y;
    if(nearD > 30){
      f.x += (nearR.x - f.x) / nearD * 46 * (dt/1000);
      f.y = Math.max(LANE_TOP+5, Math.min(LANE_BOT-5, f.y + (nearR.y - f.y) / nearD * 46 * (dt/1000)));
    }
    f.facing = nearR.x > f.x ? 1 : -1;
  } else if(f.homeY !== undefined){
    // Back into line once the threat is gone
    f.y += (f.homeY - f.y) * Math.min(1, dt / 600);
    if(Math.abs(f.homeY - f.y) < 0.5){ f.y = f.homeY; f.homeY = undefined; }
  }
  if(nearR && nearD < 36 && f.atkCd <= 0){
    // French attacks Russian — identical to Russian attack: 34 dmg, 700ms cooldown, 3 hits to kill
    f.atkCd = f.atkCdMax;
    f.lungeAt = gameTime;
    nearR.hp -= 34 + Math.floor(Math.random()*4);
    nearR.flash = 200;
    fxHit(nearR, nearR.x > f.x ? 1 : -1);
    if(Math.random() < 0.3) fxShot(f, nearR.x > f.x ? 1 : -1);
    nearR.knockVX = (nearR.x > f.x ? 1 : -1) * 80;
    nearR.knockTimer = 180;
    if(nearR.hp <= 0 && !nearR.dying){ nearR.dying = true; nearR.dyingMs = 800; }
  }
}

}
}

function updateFarmsAndBridges(dt){
for(const farm of farms){
if(farm.burning){
farm.burnTimer -= dt;
farm.food = Math.max(0, farm.food - dt * 0.02);
if(farm.burnTimer <= 0){
farm.alive = false;
farm.burning = false;
farm.burnt = true;
farm.food = 0;
if(russia.sharedFarmTarget === farm) russia.sharedFarmTarget = null;
}
} else if(!farm.burnt && farm.food < farm.maxFood){
// Peasants return and the harvest comes in: a looted farm recovers, a burned one never does
farm.food = Math.min(farm.maxFood, farm.food + farm.maxFood * dt / REGROW_MS);

}
}
}

// Interpolate a keyframe table (numbers and colours) at position v along key `k`
function sampleKeys(keys, k, v){

}
function drawPuff(color, x, y, r, alpha){
  if(alpha <= 0.004 || r <= 0.5) return;
  const ga = ctx.globalAlpha;
  ctx.globalAlpha = ga * Math.min(1, alpha);
  ctx.drawImage(getPuff(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = ga;
}
// Additive glow (fire light, embers, sun halos)
const _glowCache = new Map();
function getGlow(color){
  color = quantKey(color);
  let c = _glowCache.get(color);
  if(!c){
    capCache(_glowCache, 48);
    c = makeCanvas(128, 128);
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, css(color, 1)); gr.addColorStop(0.25, css(color, 0.5));
    gr.addColorStop(0.6, css(color, 0.12)); gr.addColorStop(1, css(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    _glowCache.set(color, c);

}
function drawGlow(color, x, y, r, alpha){
  if(alpha <= 0.004) return;
  const prev = ctx.globalCompositeOperation, ga = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = ga * Math.min(1, alpha);
  ctx.drawImage(getGlow(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = ga;
  ctx.globalCompositeOperation = prev;
}
// A column of smoke rising from (x, y): soft puffs that grow, drift with the wind and fade
function drawSmokeColumn(x, y, height, width, alpha, color, seed, speed){
  const n = 9, t = gameTime * 0.001 * (speed || 1) * 0.18;
  const lean = (env ? env.wind : 10) * 0.9;
  for(let i = 0; i < n; i++){
    const u = posMod(i / n + t + seed * 0.37, 1);       // 0 at the source, 1 at the top
    const py = y - u * height;
    const px = x + lean * u * u * (height / 90) + Math.sin(u * 5 + seed + gameTime * 0.0006) * width * 0.25;
    const r = width * (0.35 + u * 1.1);
    const a = alpha * Math.min(1, u * 6) * (1 - u) * 1.25;
    drawPuff(color, px, py, r, a);
  }
}

// -- SKY --
function drawSky(){
  const e = env;
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
  g.addColorStop(0, css(e.top)); g.addColorStop(0.58, css(e.mid)); g.addColorStop(1, css(e.hor));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON_Y + 6);

  // Overcast deck rolls in through autumn and winter
  if(e.cover > 0.55){
    const k = (e.cover - 0.55) / 0.45;
    const og = ctx.createLinearGradient(0, 0, 0, 170);
    og.addColorStop(0, css(e.cSh, 0.75 * k)); og.addColorStop(1, css(e.cSh, 0));
    ctx.fillStyle = og; ctx.fillRect(0, 0, W, 170);
  }
  // Sun and its halo
  if(e.sunA > 0.01){
    drawGlow(css(e.sun), e.sunX, e.sunY, 190, 0.45 * e.sunA);
    drawGlow(css(mix(e.sun, '#ffffff', 0.4)), e.sunX, e.sunY, 46, 0.7 * e.sunA);
    ctx.fillStyle = css(mix(e.sun, '#ffffff', 0.55), Math.min(1, e.sunA * 1.2));
    ctx.beginPath(); ctx.arc(e.sunX, e.sunY, 14, 0, TAU); ctx.fill();
  }
  // Glow of fires below the horizon
  if(e.fire > 0.01){
    const fg = ctx.createLinearGradient(0, HORIZON_Y - 170, 0, HORIZON_Y);
    fg.addColorStop(0, 'rgba(255,90,20,0)'); fg.addColorStop(1, `rgba(255,105,35,${0.5 * e.fire})`);
    ctx.fillStyle = fg; ctx.fillRect(0, HORIZON_Y - 170, W, 176);
  }
  drawClouds();
  drawBirds();
}

// Cloud shapes are generated once; their sprites are re-rendered only when the
// sky palette moves to a new bucket (season / smoke / fire).
const CLOUD_SHAPES = (() => {
  const r = rng(1812), shapes = [];
  for(let i = 0; i < 10; i++){
    const w = 200 + r() * 240, h = 74 + r() * 56, puffs = [];
    const n = 11 + (r() * 9 | 0);
    for(let k = 0; k < n; k++){
      const u = r();
      const edge = 1 - Math.pow(Math.abs(u - 0.5) * 2, 1.5);
      const pr = h * (0.15 + 0.2 * r()) * (0.5 + 0.5 * edge);
      puffs.push([w * (0.12 + 0.76 * u), h * 0.7 - pr * (0.4 + 0.6 * r()) * (0.4 + edge), pr]);
    }
    puffs.sort((a, b) => b[1] - a[1]); // lower puffs first so lit tops overlap them
    shapes.push({ w, h, puffs });
  }
  return shapes;
})();
let cloudSprites = null, cloudKey = '';
function renderCloud(shape, lit, sh){
  const c = makeCanvas(shape.w, shape.h), g = c.getContext('2d');
  const body = mix(lit, sh, 0.5);
  // Body: one soft-edged silhouette (same colour everywhere, so no inner rims)
  for(const [x, y, r] of shape.puffs){
    const gr = g.createRadialGradient(x, y, r * 0.6, x, y, r);
    gr.addColorStop(0, css(body)); gr.addColorStop(1, css(body, 0));
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // Sunlit tops: soft highlights lifted toward the sky, only where there is cloud
  g.globalCompositeOperation = 'source-atop';
  for(const [x, y, r] of shape.puffs){
    const gr = g.createRadialGradient(x - r * 0.2, y - r * 0.45, 0, x - r * 0.2, y - r * 0.45, r * 0.95);
    gr.addColorStop(0, css(lit, 0.95)); gr.addColorStop(0.6, css(lit, 0.45)); gr.addColorStop(1, css(lit, 0));
    g.fillStyle = gr; g.fillRect(x - r * 1.3, y - r * 1.5, r * 2.6, r * 2.4);
  }
  // Shadowed underside
  const ug = g.createLinearGradient(0, shape.h * 0.35, 0, shape.h * 0.75);
  ug.addColorStop(0, css(sh, 0)); ug.addColorStop(1, css(sh, 0.7));
  g.fillStyle = ug; g.fillRect(0, shape.h * 0.35, shape.w, shape.h * 0.65);
  // Flat, soft base
  g.globalCompositeOperation = 'destination-out';
  const fb = g.createLinearGradient(0, shape.h * 0.62, 0, shape.h * 0.8);
  fb.addColorStop(0, 'rgba(0,0,0,0)'); fb.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = fb; g.fillRect(0, shape.h * 0.6, shape.w, shape.h * 0.4);
  return c;
}
function drawClouds(){
  const e = env;
  const key = `${Math.round(e.T * 14)}|${Math.round(e.smoke * 5)}|${Math.round(e.fire * 5)}`;
  if(key !== cloudKey){
    cloudKey = key;
    cloudSprites = CLOUD_SHAPES.map(s => renderCloud(s, e.cLit, e.cSh));
  }
  // Heavier cover flattens fair-weather cumulus into long stratus banks
  const strat = smooth(0.6, 1.0, e.cover);
  const n = Math.round(5 + e.cover * 9), span = W + 900;
  for(let i = 0; i < n; i++){
    const d = 0.25 + hash1(i * 31 + 7) * 0.75;          // depth: 0.25 far .. 1 near
    const spr = cloudSprites[i % cloudSprites.length];
    const s = 0.34 + d * 0.5;
    const sw = spr.width * s * (1 + strat * 1.4), sh = spr.height * s * (1 - strat * 0.45);
    const drift = gameTime * 0.001 * e.wind * (0.15 + d * 0.35);
    const x = posMod(hash1(i * 17 + 3) * span - camera.x * (0.015 + d * 0.045) + drift, span) - 450;
    const y = 74 + (1 - d) * 112 + hash1(i * 5 + 1) * 24 - sh * 0.62;
    ctx.globalAlpha = 0.5 + d * 0.45;
    ctx.drawImage(spr, x, y, sw, sh);
  }
  ctx.globalAlpha = 1;
}

// Crows: a few in summer, gathering into wheeling flocks over the dead later on
function drawBirds(){
  const e = env;
  const flocks = Math.round(1 + smooth(0.4, 1.4, e.T) * 3 + e.scorch);
  ctx.strokeStyle = css(mix('#1c1c22', e.hor, 0.25), 0.85);
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for(let f = 0; f < flocks; f++){
    const circling = f % 2 === 1 && e.T > 0.6;
    const n = 4 + (hash1(f * 11) * 6 | 0);
    const span = W + 300;
    const dir = hash1(f * 3 + 2) > 0.5 ? 1 : -1;
    const cx = posMod(hash1(f * 23 + 5) * span - camera.x * 0.12 + (circling ? 0 : dir * gameTime * 0.022), span) - 150;
    const cy = 80 + hash1(f * 13 + 9) * 90;
    for(let b = 0; b < n; b++){
      let bx, by;
      if(circling){
        const a = gameTime * 0.0006 * (b % 2 ? 1 : -1) + b * 1.7;
        bx = cx + Math.cos(a) * (30 + b * 6); by = cy + Math.sin(a) * (10 + b * 2);
      } else {
        bx = cx - dir * (b * 13 + hash1(b * 7 + f) * 9); by = cy + Math.abs(b - n / 2) * 4 + hash1(b + f * 9) * 6;
      }
      const flap = Math.sin(gameTime * 0.012 + b * 1.3 + f) * 2.6;
      const s = 3.2 + hash1(b * 3 + f) * 1.6;
      ctx.beginPath();
      ctx.moveTo(bx - s, by - flap); ctx.quadraticCurveTo(bx - s * 0.4, by - flap * 0.2, bx, by);
      ctx.quadraticCurveTo(bx + s * 0.4, by - flap * 0.2, bx + s, by - flap);
      ctx.stroke();
    }
  }
  ctx.lineCap = 'butt';
}
// -- BACKDROP: hills, landmarks and distant terrain behind the horizon --
const tri = v => 1 - Math.abs(2 * (v - Math.floor(v)) - 1); // 0..1 triangle wave, period 1
const HILL_RANGES = [
  { par:0.025, base:HORIZON_Y - 8, a:[44, 22, 14], f:[0.0011, 0.0027, 0.0063], ph:0.3, haze:0.72 },
  { par:0.06,  base:HORIZON_Y - 3, a:[30, 15, 8],  f:[0.0016, 0.0041, 0.0097], ph:2.1, haze:0.48 },
  { par:0.11,  base:HORIZON_Y + 2, a:[16, 9, 5],   f:[0.0024, 0.0059, 0.0137], ph:4.4, haze:0.26, forest:true },
];
function ridgeHeight(r, x, birch, pine){
  const wx = x + camera.x * r.par;
  let h = (Math.sin(wx * r.f[0] + r.ph) * 0.5 + 0.5) * r.a[0]
        + Math.sin(wx * r.f[1] + r.ph * 1.7) * r.a[1]
        + Math.sin(wx * r.f[2] + r.ph * 2.3) * r.a[2];
  if(r.forest){
    h += birch * (Math.abs(Math.sin(wx * 0.09)) * 7 + Math.abs(Math.sin(wx * 0.21 + 1)) * 3);
    h += pine * (tri(wx / 22) * 10 + tri(wx / 9 + 0.3) * 4);
  }
  return r.base - Math.max(0, h);
}
// Weight of each terrain zone, cross-fading over a short band so scenery never pops
function zoneWeights(p){
  const f = (a, b) => smooth(a - 0.015, a + 0.015, p) * (1 - smooth(b - 0.015, b + 0.015, p));
  return { fields:f(-1, 0.18), birch:f(0.18, 0.50), pine:f(0.50, 0.72), steppe:f(0.72, 0.92), outskirts:f(0.92, 2) };
}

function drawParallax(){
  const e = env, p = e.mapP, hz = HORIZON_Y;
  const birch = smooth(0.15, 0.22, p) * (1 - smooth(0.48, 0.54, p));
  const pine = smooth(0.48, 0.54, p) * (1 - smooth(0.70, 0.76, p));
  for(let i = 0; i < HILL_RANGES.length; i++){
    const r = HILL_RANGES[i];
    const c = mix(i === 2 ? mix(e.land, e.canopy, (birch + pine) * 0.55) : e.land, e.haze, r.haze);
    ctx.fillStyle = css(c);
    ctx.beginPath(); ctx.moveTo(-4, hz + 8);
    for(let x = -4; x <= W + 4; x += 4) ctx.lineTo(x, ridgeHeight(r, x, birch, pine));
    ctx.lineTo(W + 4, hz + 8); ctx.closePath(); ctx.fill();
    // Light catching the ridge (snow-lit in winter)
    ctx.strokeStyle = css(mix(c, e.winterBg > 0.3 ? SNOW_LIT : '#ffffff', 0.28 + e.winterBg * 0.4), 0.55);
    ctx.lineWidth = 1.5 + e.winterBg * 1.5;
    ctx.beginPath();
    for(let x = -4; x <= W + 4; x += 6){ const y = ridgeHeight(r, x, birch, pine) + 1; x === -4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    if(i === 1) drawLandmarks(r, mix(c, '#141414', 0.22), birch, pine);
  }
  // Aerial haze pooling along the horizon
  const hg = ctx.createLinearGradient(0, hz - 70, 0, hz + 4);
  hg.addColorStop(0, css(e.haze, 0)); hg.addColorStop(1, css(e.haze, 0.55 + e.fog * 0.4));
  ctx.fillStyle = hg; ctx.fillRect(0, hz - 70, W, 76);

  // Mid layer (20% parallax): terrain-specific detail standing on the horizon
  const zw = zoneWeights(p), off = camera.x * 0.2, treeY = hz + 3;
  const layers = [['fields', drawScatteredTrees], ['birch', drawBirchForest], ['pine', drawPineForest], ['steppe', drawSteppe], ['outskirts', drawMoscowOutskirts]];
  for(const [k, fn] of layers){
    if(zw[k] <= 0.001) continue;
    ctx.globalAlpha = zw[k];
    fn(off, treeY);
  }
  ctx.globalAlpha = 1;
  // Blizzard whiteout swallows the distance
  if(e.fog > 0.01){
    const fg = ctx.createLinearGradient(0, 40, 0, hz + 6);
    fg.addColorStop(0, css(e.haze, e.fog * 0.35)); fg.addColorStop(1, css(e.haze, e.fog * 0.8));
    ctx.fillStyle = fg; ctx.fillRect(0, 40, W, hz - 34);
  }
}

// Church spires, windmills and ruined forts riding the middle ridge
function drawLandmarks(r, c, birch, pine){
  const e = env, p = e.mapP, off = camera.x * r.par;
  ctx.fillStyle = css(c); ctx.strokeStyle = css(c);
  if(p < 0.74){
    for(let i = 0; i < 4; i++){
      const x = posMod(i * 2900 + 1300 - off, 4 * 2900) - 100;
      if(x < -40 || x > W + 40) continue;
      const by = ridgeHeight(r, x, birch, pine) + 4;
      ctx.fillRect(x - 5, by - 22, 10, 22);                       // church body
      ctx.fillRect(x + 5, by - 12, 14, 12);
      ctx.beginPath(); ctx.ellipse(x, by - 27, 6, 7, 0, 0, TAU); ctx.fill(); // onion
      ctx.beginPath(); ctx.moveTo(x - 3, by - 31); ctx.quadraticCurveTo(x, by - 40, x + 3, by - 31); ctx.fill();
      ctx.fillRect(x - 0.5, by - 45, 1.2, 7); ctx.fillRect(x - 2.5, by - 42.5, 5, 1.1);
    }
    for(let i = 0; i < 3; i++){
      const x = posMod(i * 3700 + 600 - off, 3 * 3700) - 100;
      if(x < -30 || x > W + 30) continue;
      const by = ridgeHeight(r, x, birch, pine) + 4;
      ctx.beginPath(); ctx.moveTo(x - 6, by); ctx.lineTo(x - 3.5, by - 20); ctx.lineTo(x + 3.5, by - 20); ctx.lineTo(x + 6, by); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 5, by - 20); ctx.lineTo(x, by - 26); ctx.lineTo(x + 5, by - 20); ctx.fill();
      ctx.lineWidth = 1.2;
      const sa = gameTime * 0.0007 + i;
      for(let a = 0; a < 4; a++){
        const aa = sa + a * Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(x, by - 21); ctx.lineTo(x + Math.cos(aa) * 12, by - 21 + Math.sin(aa) * 12); ctx.stroke();
      }
    }
  } else {
    for(let i = 0; i < 3; i++){
      const x = posMod(i * 5300 + 2100 - off, 3 * 5300) - 100;
      if(x < -60 || x > W + 60) continue;
      const by = ridgeHeight(r, x, birch, pine) + 4;
      ctx.fillRect(x - 26, by - 14, 52, 14);
      for(let b = 0; b < 5; b++) if((b + i) % 3) ctx.fillRect(x - 24 + b * 11, by - 18 - (b % 2) * 5, 7, 6);
      ctx.fillRect(x - 6, by - 26, 12, 14);
      drawSmokeColumn(x + 4, by - 20, 120, 16, 0.32 * (1 - e.snow), '#3a3029', i, 0.8);
    }
  }
}

// Fields: lone oaks, haystacks and a distant village
function drawScatteredTrees(off, treeY){
  const e = env, haze = 0.22;
  const trunk = css(mix('#4a3a26', e.haze, haze));
  const leaf = mix(mix(e.canopy, e.haze, haze), '#8a8470', e.frost * 0.5);
  for(let i = 0; i < 16; i++){
    const x = posMod(i * 1847 + 331 - off, 3400) - 200;
    if(x < -60 || x > W + 60) continue;
    const h = 22 + (i * 13) % 20, r = 11 + (i % 3) * 4;
    drawTree('oak', x, treeY, h, r, leaf, trunk, e.winterBg);
  }
  for(let i = 0; i < 7; i++){
    const x = posMod(i * 1523 + 773 - off, 2900) - 30;
    if(x < -20 || x > W + 20) continue;
    const hs = mix(mix('#c8a446', e.haze, haze), '#a09a84', e.frost * 0.6);
    ctx.fillStyle = css(hs);
    ctx.beginPath(); ctx.moveTo(x - 9, treeY); ctx.quadraticCurveTo(x - 8, treeY - 14, x, treeY - 16); ctx.quadraticCurveTo(x + 8, treeY - 14, x + 9, treeY); ctx.fill();
    ctx.fillStyle = css(shade(hs, 0.8)); ctx.fillRect(x - 8, treeY - 5, 17, 2);
    if(e.winterBg > 0.1){ ctx.fillStyle = css(SNOW_LIT, e.winterBg); ctx.beginPath(); ctx.ellipse(x, treeY - 14, 6, 3, 0, Math.PI, 0); ctx.fill(); }
  }
  const vx = posMod(1400 - off, 3600) - 100;
  if(vx > -150 && vx < W + 100){
    const wall = css(mix(mix('#9a8a6a', e.haze, 0.35), SNOW_SH, e.winterBg * 0.4));
    const roof = css(mix(mix('#6a4a30', e.haze, 0.35), SNOW_LIT, e.winterBg * 0.85));
    for(let h = 0; h < 5; h++){
      const hx = vx - 50 + h * 21, hh = 9 + (h % 2) * 3;
      ctx.fillStyle = wall; ctx.fillRect(hx, treeY - hh, 15, hh);
      ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(hx - 2, treeY - hh); ctx.lineTo(hx + 7.5, treeY - hh - 8); ctx.lineTo(hx + 17, treeY - hh); ctx.fill();
    }
    const cx = vx + 70;
    ctx.fillStyle = css(mix(mix('#d8ccb0', e.haze, 0.3), SNOW_SH, e.winterBg * 0.3));
    ctx.fillRect(cx - 7, treeY - 34, 14, 34); ctx.fillRect(cx + 7, treeY - 18, 18, 18);
    ctx.fillStyle = css(mix(mix('#3f6a52', e.haze, 0.3), SNOW_LIT, e.winterBg * 0.7));
    ctx.beginPath(); ctx.ellipse(cx, treeY - 41, 8, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 4, treeY - 47); ctx.quadraticCurveTo(cx, treeY - 58, cx + 4, treeY - 47); ctx.fill();
    ctx.fillStyle = css(mix('#c4a030', e.haze, 0.3)); ctx.fillRect(cx - 0.6, treeY - 63, 1.4, 8); ctx.fillRect(cx - 3, treeY - 60, 6, 1.3);
  }
}

// One tree. kind: 'oak' | 'birch' | 'pine'. bare = 0..1 winter (leaves gone, snow on boughs)
function drawTree(kind, x, y, h, r, leaf, trunk, bare){
  if(kind === 'pine'){
    ctx.fillStyle = trunk; ctx.fillRect(x - 1.5, y - 8, 3, 8);
    const tiers = 4, dark = css(shade(leaf, 0.72)), lit = css(mix(leaf, '#d8e0b0', 0.12));
    for(let t = 0; t < tiers; t++){
      const ty = y - 6 - t * (h / tiers) * 0.92, tw = r * (1 - t * 0.2), th = h / tiers + 7;
      ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(x - tw, ty); ctx.lineTo(x, ty - th); ctx.lineTo(x, ty + 1); ctx.fill();
      ctx.fillStyle = lit; ctx.beginPath(); ctx.moveTo(x, ty + 1); ctx.lineTo(x, ty - th); ctx.lineTo(x + tw, ty); ctx.fill();
      if(bare > 0.15){
        ctx.fillStyle = css(SNOW_LIT, bare * 0.95);
        ctx.beginPath(); ctx.moveTo(x - tw * 0.85, ty - 1); ctx.quadraticCurveTo(x - tw * 0.3, ty - th * 0.45, x, ty - th * 0.62);
        ctx.quadraticCurveTo(x + tw * 0.3, ty - th * 0.45, x + tw * 0.85, ty - 1); ctx.quadraticCurveTo(x, ty - th * 0.3, x - tw * 0.85, ty - 1); ctx.fill();
      }
    }
    return;
  }
  const isBirch = kind === 'birch';
  ctx.fillStyle = trunk;
  ctx.fillRect(x - (isBirch ? 1.2 : 1.8), y - h, isBirch ? 2.4 : 3.6, h);
  if(isBirch){
    ctx.fillStyle = 'rgba(40,36,32,0.55)';
    for(let m = 0; m < 4; m++) ctx.fillRect(x - 1.2, y - h * (0.2 + m * 0.2), 2.4, 1.2);
  }
  // Bare branches show through as the leaves go
  if(bare > 0.2){
    ctx.strokeStyle = trunk; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let b = 0; b < 4; b++){
      const by = y - h * (0.55 + b * 0.13), s = (b % 2 ? 1 : -1);
      ctx.moveTo(x, by); ctx.lineTo(x + s * r * (0.7 - b * 0.1), by - r * 0.6);
    }
    ctx.stroke();
  }
  const leafA = 1 - smooth(0.25, 0.85, bare);
  if(leafA > 0.02){
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * leafA;
    const cy = y - h - (isBirch ? r * 0.3 : r * 0.1);
    const blobs = isBirch ? [[0, 0, 0.75, 1.15], [-0.45, 0.35, 0.55, 0.8], [0.45, 0.3, 0.55, 0.8]]
                          : [[0, 0, 1, 0.85], [-0.6, 0.3, 0.7, 0.62], [0.62, 0.28, 0.72, 0.6], [0.1, -0.45, 0.7, 0.6]];
    ctx.fillStyle = css(shade(leaf, 0.75));
    for(const [bx, by, rx, ry] of blobs){ ctx.beginPath(); ctx.ellipse(x + bx * r, cy + by * r + 2, rx * r, ry * r, 0, 0, TAU); ctx.fill(); }
    ctx.fillStyle = css(mix(leaf, '#fff4c0', 0.18));
    for(const [bx, by, rx, ry] of blobs){ ctx.beginPath(); ctx.ellipse(x + bx * r + r * 0.12, cy + by * r - 1.5, rx * r * 0.72, ry * r * 0.7, 0, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = ga;
  }
  if(bare > 0.3){
    ctx.fillStyle = css(SNOW_LIT, (bare - 0.3) * 1.2);
    ctx.fillRect(x - r * 0.5, y - h - 1, r, 1.6);
  }
}
